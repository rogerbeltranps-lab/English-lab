<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Learning Path worksheet</title>
<link rel="icon" type="image/png" href="/English-lab/favicon-192.png">
<style>
@page{size:A4;margin:14mm 14mm 16mm}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:#1d2830;font:10.5pt/1.45 Arial,Helvetica,sans-serif}
#sheet{max-width:200mm;margin:16px auto;padding:14mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.toolbar{max-width:200mm;margin:16px auto 0;display:flex;gap:8px;justify-content:flex-end}
.toolbar button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid #9aa7b1;background:#fff;cursor:pointer}
@media print{body{background:#fff}#sheet{margin:0;padding:0;max-width:none;box-shadow:none}.toolbar{display:none}}
.sheet-head{border-bottom:2px solid #1d2830;padding-bottom:8px;margin-bottom:10px}
.who{display:grid;grid-template-columns:3fr 1fr 1.3fr;gap:10px;font-weight:700}
.who span{border-bottom:1px solid #1d2830;padding-bottom:2px}
.eyebrow{margin:10px 0 0;font-size:9pt;text-transform:uppercase;letter-spacing:.04em;color:#5f6b73}
h1{margin:2px 0 4px;font-size:17pt}
.note{margin:6px 0 0;font-size:9.5pt;padding:6px 9px;border:1px dashed #9aa7b1;border-radius:6px}
.step{margin:14px 0 6px}
h2{font-size:13pt;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.head{break-inside:avoid;break-after:avoid}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1d2830;color:#fff;font-size:10pt;flex:none}
h3{font-size:11pt;margin:10px 0 4px;break-after:avoid}
.intro{margin:0 0 6px;font-style:italic}
.box,.html .model,.reading,.chat,.listen{border:1px solid #c5ced5;border-radius:6px;padding:7px 10px;margin:6px 0;break-inside:avoid}
.box>b{display:block;margin-bottom:2px}.box div+div{margin-top:4px}
.model{background:#f6f8fa}
.reading p,.chat p{margin:4px 0}
.reading .chat{border:0;padding:0;margin:0}
.listen{background:#f6f8fa;font-size:9.5pt}
.items{padding-left:22px;margin:6px 0}
.items li{margin:0 0 9px;break-inside:avoid}
.gap{display:inline-block;min-width:34mm;border-bottom:1px solid #1d2830;height:1.1em;vertical-align:baseline}
.opts{display:flex;flex-wrap:wrap;gap:3px 18px;margin-top:3px}
.lines span{display:block;height:8.5mm;border-bottom:1px solid #9aa7b1}
.field{margin:8px 0;break-inside:avoid}
.ph{display:block;font-size:9pt;color:#5f6b73}
.ticks{list-style:none;padding:0;margin:4px 0}
.ticks li{margin:3px 0}.ticks li::before{content:"☐ ";font-size:12pt}
.rate{list-style:none;padding:0;margin:4px 0}
.rate li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted #c5ced5;padding:4px 0;break-inside:avoid}
.nums{white-space:nowrap;font-weight:700}
table.vocab{width:100%;border-collapse:collapse;font-size:9.5pt;margin:6px 0}
table.vocab th,table.vocab td{border:1px solid #c5ced5;padding:3px 6px;text-align:left;vertical-align:top}
table.vocab th{background:#f6f8fa}
table.vocab tr{break-inside:avoid}
table.vocab .grp{break-after:avoid}
table.vocab .grp td{font-weight:700;background:#eef1f4}
.tiny{font-size:9pt;color:#5f6b73;margin:4px 0}
.tip{font-size:9.5pt;margin:4px 0}
.transcripts{break-before:page}
.tr{margin:8px 0}.tr p{margin:3px 0}
.is-key .gap.filled,.is-key .key-line,.is-key .opt.right{color:#b3261e;font-weight:700}
.is-key .gap.filled{min-width:0;padding:0 4px}
.is-key .opt.right{outline:2px solid #b3261e;border-radius:4px;padding:0 3px}
img{max-width:100%}
.study .panel-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.study .pill{font-size:9pt;color:#5f6b73;white-space:nowrap}
.study .instruction{margin:2px 0 6px}
.study .tiny{font-size:9pt;color:#5f6b73}
.study-tips{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.study-tips .box p{margin:2px 0}
.study .model{border:1px solid #c5ced5;border-radius:6px;padding:7px 10px;margin:6px 0;background:#f6f8fa}
.study .question{margin:0 0 9px;break-inside:avoid}.study .q-title{margin:0}
.study-block{margin:12px 0}
.study-keys{break-before:page}
body.locked>*:not(#gate){display:none!important}
#gate{display:none;max-width:420px;margin:60px auto;padding:20px;background:#fff;border:1px solid #c5ced5;border-radius:12px;font:15px/1.5 Arial,Helvetica,sans-serif;text-align:center}
body.locked #gate{display:block}
#gate button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid #1f5f8b;background:#1f5f8b;color:#fff;cursor:pointer}
</style>
</head>
<body class="locked">
<div id="gate"></div>
<div class="toolbar"><button type="button" onclick="print()">🖨 Print</button></div>
<main id="sheet">Loading…</main>
<script src="../js/el-study.js"></script>
<script src="../js/lp-worksheet.js"></script>
<script src="../js/el-copyright.js"></script>
<script src="../js/el-route-names.js"></script>
<script type="module" src="teacher-gate.js"></script>
</body>
</html>
