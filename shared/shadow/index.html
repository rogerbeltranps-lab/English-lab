<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Class shadowing</title>
<link rel="icon" type="image/png" href="/English-lab/favicon-192.png">
<!-- Class shadowing (Roger, 30 Oct 2026: "I usually do 5 minutes of shadowing at the beginning of each class"): the projector page for the
     shadowing clips of an LS. ?ls=4eso/seasons-and-celebrations lists the shadow panels (type 'shadow') of that LS's Learning Paths
     (shared/print/lp-list.js, data/<lp>.js) and plays one: normal or slower, the four rounds, the script hidden in round 4.
     The clips are the same as the Learning Path step, so students do at home what they did in class. Nothing is saved. -->
<style>
:root{--ink:#14232e;--muted:#5d6b75;--line:#d3dbe1;--bg:#f2f5f7;--card:#fff;--accent:#1f5f8b}
body.c2eso{--accent:#1d6b4f}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
h1{margin:0 0 4px;font-size:1.7rem}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
select,button{font:inherit;font-size:1rem;border-radius:10px;border:1px solid var(--line);padding:8px 14px;background:#fff;color:var(--ink);cursor:pointer}
select{max-width:100%}
button.on,button.main{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rounds button{text-align:left;line-height:1.3;padding:10px 12px}
.rounds b{display:block;font-size:.85rem;opacity:.8}
video{width:100%;max-height:46vh;border-radius:14px;background:#000}
#script p{font-size:clamp(1.15rem,2.4vw,1.75rem);line-height:1.45;margin:.35em 0}
#script.hidden{display:none}
#hiddenNote{display:none;font-size:1.4rem;text-align:center;padding:30px 0}
#script.hidden+#hiddenNote{display:block}
.crumb a{color:var(--accent)}
</style>
</head>
<body>
<main>
<p class="crumb"><a href="../../teacher.html">← Dashboard</a></p>
<h1 id="title">Class shadowing</h1>
<p class="muted">Five minutes at the start of the class. Choose the clip, then go through the four rounds together.</p>
<div class="bar"><select id="clip" aria-label="Clip"></select></div>
<div class="card">
  <div id="media"></div>
  <div class="bar">
    <button class="main" type="button" id="play">▶ Play the clip</button>
    <button type="button" id="stop">■ Stop</button>
    <button type="button" data-slow="0">Normal speed</button>
    <button type="button" data-slow="1">Slower version</button>
    <span class="muted" id="count"></span>
  </div>
  <div class="rounds" id="rounds"></div>
</div>
<div class="card"><div id="script"></div><p id="hiddenNote">🙈 No script now: shadow from memory.</p></div>
</main>
<script src="../print/lp-list.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ROUNDS = [['1 · Listen and read', 'Read the script while you listen.'], ['2 · Mumble', 'Say the words quietly, at the same time.'],
    ['3 · Shadow', 'Say it aloud just behind the speaker.'], ['4 · No script', 'Shadow without looking.']];
  const all = window.LP_PRINT || {}, q = new URLSearchParams(location.search);
  const ls = all[q.get('ls')] ? q.get('ls') : Object.keys(all).pop(), info = all[ls], base = '../../' + ls + '/';
  document.body.className = 'c' + ls.split('/')[0];
  $('#title').textContent = 'Class shadowing · ' + info.title;
  // load each Learning Path's data file in turn (each one sets window.LP) and keep its shadowing panels
  const clips = [];
  const load = i => {
    if (i >= info.lps.length) return start();
    const [lp, name] = info.lps[i], s = document.createElement('script');
    window.LP = null; s.src = base + 'data/' + lp + '.js';
    s.onload = () => { ((window.LP || {}).panels || []).filter(p => p.type === 'shadow').forEach(p => clips.push({ lp, name, c: p.clip })); load(i + 1); };
    s.onerror = () => load(i + 1);
    document.head.appendChild(s);
  };
  let cur = null, slow = false, m = null, endAt = 0, plays = 0, round = 0;
  const KEY = 'elShadowClip_' + ls;
  function start() {
    if (!clips.length) { $('#script').innerHTML = '<p class="muted">This LS has no shadowing clips yet.</p>'; return; }
    $('#clip').innerHTML = clips.map((x, i) => '<option value="' + i + '">LP ' + esc(x.name) + ' — ' + esc(x.c.title) + '</option>').join('');
    let saved = 0; try { saved = +localStorage.getItem(KEY) || 0; } catch (e) {}
    $('#clip').value = String(Math.min(saved, clips.length - 1));
    $('#clip').onchange = () => { try { localStorage.setItem(KEY, $('#clip').value); } catch (e) {} pick(); };
    $('#rounds').innerHTML = ROUNDS.map((r, i) => '<button type="button" data-r="' + i + '"><b>' + r[0] + '</b>' + r[1] + '</button>').join('');
    $$('[data-r]').forEach(b => b.onclick = () => setRound(+b.dataset.r));
    $$('[data-slow]').forEach(b => b.onclick = () => { slow = b.dataset.slow === '1'; if (m) m.pause(); endAt = 0; mark(); });
    $('#play').onclick = play;
    $('#stop').onclick = () => { endAt = 0; if (m) m.pause(); };
    pick();
  }
  function pick() {
    cur = clips[+$('#clip').value].c; plays = 0; count(); endAt = 0;
    $('#media').innerHTML = cur.video ? '<video id="m" preload="metadata" playsinline' + (cur.poster ? ' poster="' + base + cur.poster + '"' : '') + '></video>' : '<audio id="m" preload="metadata"></audio>';
    m = $('#m');
    m.ontimeupdate = () => { if (endAt && m.currentTime >= endAt) { endAt = 0; m.pause(); } };
    $('#script').innerHTML = cur.lines.map(l => '<p>' + (Array.isArray(l) && l.length > 1 ? '<b>' + esc(l[0]) + ':</b> ' + esc(l[1]) : esc(Array.isArray(l) ? l[0] : l)) + '</p>').join('');
    setRound(0); mark();
  }
  function play() {
    const src = base + (slow ? cur.slow : cur.src), t = slow ? cur.ts : cur.t;
    const go = () => { m.currentTime = t[0]; endAt = t[1]; m.play().catch(() => {}); plays++; count(); };
    if (!m.src || !m.src.endsWith(src.replace('../../', ''))) { m.src = src; m.addEventListener('loadedmetadata', go, { once: true }); m.load(); } else go();
  }
  const count = () => { $('#count').textContent = 'Plays: ' + plays; };
  const mark = () => $$('[data-slow]').forEach(b => b.classList.toggle('on', (b.dataset.slow === '1') === slow));
  function setRound(i) { round = i; $$('[data-r]').forEach(b => b.classList.toggle('on', +b.dataset.r === i)); $('#script').classList.toggle('hidden', i === 3); }
  load(0);
})();
</script>
</body>
</html>
