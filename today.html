ol.ptrank{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:4px 0 8px}ol.ptrank li{border:1px solid #e2e8f0;border-radius:999px;padding:2px 10px;font-size:13px}ol.ptrank li.me{border-color:#f59e0b;background:#fffbeb;font-weight:600}ul.ptrules{list-style:none;padding:0;margin:6px 0}ul.ptrules li{margin:5px 0}.pend.live{background:#eff6ff;border-color:#93c5fd;flex-wrap:wrap}.pend.live a.go{padding:10px 16px;font-size:15px}</style></head><body>

<div class="page"><h1>Les meves activitats</h1><p class="muted" id="sub">Carregant…</p><div id="note"></div><div id="main"></div></div></div>

<script src="shared/js/el-sections.js"></script>
<script src="shared/js/el-criteria.js"></script>
<script src="shared/js/el-grading.js"></script>
<script src="shared/js/el-plan.js"></script>

<script type="module">
// Student board: the same grid the teacher sees, for this student only (one row).
// Language (Roger, 25 Oct 2026): Catalan for Insecure, English for Safe and Daring, by the student's route in the LS on screen
// (any LS while it has none; Catalan while there is no route at all). The teacher and testers see it in English.
// Demo mode: a page that defines window.EL_DEMO_STUDENT before this script gets sample data and no Firebase.
const DEMO=window.EL_DEMO_STUDENT;let F=null;
if(!DEMO){await import("./shared/js/el-cloud.js");F=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")}
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let EN=false;const t=(ca,en)=>EN?en:ca;
let COURSE=null;   // course of the LS on screen: criteria texts depend on it
const pill=c=>`<span class="pill ce${c[0]}" data-do="crit" data-c="${c}" tabindex="0" title="${esc(elCompetence(c)+" · "+c+": "+(elCriterion(COURSE,c)||"–"))}">${c}</span>`;
const LV=Object.fromEntries(EL_LEVELS.map(l=>[l.id,l.name]));
const route=l=>l?`<span class="route r-${l}">${LV[l]||l}</span>`:"–";
const steps=a=>EL_ACTIONS[a.id]||[];
const stepCrit=(a,k)=>(a.skip||[]).includes(k)?`<small class="muted">${t("no puntua","no points")}</small>`:((((window.EL_STEP_CRITERIA||{})[a.id]||{})[k]||EL_EVIDENCE[k]||[]).map(pill).join("")||`<small class="muted" title="${t("Pràctica de llengua: sense criteri","Language practice: no criterion")}">–</small>`);
const pts=a=>a.graded?(a.manual?t("nota del professor","teacher's mark"):a.points+(a.points===1?t(" punt"," point"):t(" punts"," points"))):t("no avalua","not assessed");
const col=p=>p>=90?"#8b5cf6":p>=75?"#2563eb":p>=50?"#16a34a":"#94a3b8";
const S={ls:null,view:"lp",pend:[]};let U=null,D=null;   // view: lp = one grid per learning path · sum = summary of my criteria

// D = {me:{name,group}, rs:{activity:result}, lv:{ls:{level}}, pg:{ls:data}, ls:{id:{status,enabled,groups,open,secLocked}}, pt:{team,t1,t2,t3}, tm:{list,score,best}}
async function load(u){
  if(DEMO)return DEMO;
  const db=ELCloud.db,D={me:{},rs:{},lv:{},pg:{},ls:{}},q=async(p,f)=>{try{(await F.getDocs(F.collection(db,...p))).forEach(f)}catch(e){}};
  try{const s=await F.getDoc(F.doc(db,"students",u.uid));if(s.exists())D.me=s.data()}catch(e){}
  D.me.name=D.me.name||u.displayName||u.email;
  if(ELCloud.viewGroup())D.me.group=ELCloud.viewGroup();   // tester in the student view of a group
  await q(["students",u.uid,"results"],r=>D.rs[r.data().activity]=r.data());
  await q(["students",u.uid,"levels"],l=>D.lv[l.id]=l.data());
  await q(["students",u.uid,"progress"],p=>D.pg[p.id]=p.data().data||{});
  for(const l of EL_LS)D.ls[l.id]=await ELCloud.lsInfo(l.id);
  try{const p=await F.getDoc(F.doc(db,"points",(u.email||"").toLowerCase()));if(p.exists())D.pt=p.data()}catch(e){}
  if(D.me.group)try{const t=await F.getDoc(F.doc(db,"teams",D.me.group));if(t.exists())D.tm=t.data()}catch(e){}
  return D;
}
const all=()=>!DEMO&&(ELCloud.isTeacher(U)||(ELCloud.isTester(U)&&!ELCloud.viewGroup()));   // teacher and testers see every LS (not in a group's student view)
function setLang(){
  const lv=elRouteOf(D.lv,S.ls).level||(Object.values(D.lv).find(x=>x&&x.level)||{}).level;
  EN=all()||(!!lv&&!elCa(lv));
  document.documentElement.lang=EN?"en":"ca";
  document.title=t("Les meves activitats","My activities")+" · English Lab";
  $("h1").textContent=t("Les meves activitats","My activities");
}
const doneSet=a=>{const p=D.pg[a.ls]||{},s=new Set();a.keys.forEach(k=>elDoneSet(p[k]).forEach(x=>s.add(x)));return s};
// a step of a section the teacher has not opened yet for the group (elSecLocked; a vocabulary section holds the cards and practice steps)
const secOff=(a,info,k)=>{if(info.status==="closed"||all())return false;const off=elSecLockedFor(a,info,D.me.group,doneSet(a));return off.includes(k)||((k==="cards"||k==="practice")&&off.includes("vocab"))};
// learning paths the teacher has opened for the group (elLpOpen in el-catalog.js); a closed LS can be reviewed
const canDo=(a,info)=>info.status==="closed"||all()||elLpOpen(a,info,D.me.group);
function cell(a){
  const x=D.rs[a.id],d=doneSet(a);let v,c="";
  if(a.manual)v=x&&x.max?x.score+"/"+x.max:"–";
  else if(a.graded)v=x?(x.score||0)+"/"+a.points:"–";
  else{const n=steps(a).filter(k=>d.has(k)).length;v=steps(a).length?n+"/"+steps(a).length:"–";c="na"}
  if(x&&x.locked){v+=" ✔";c="sub"}else if(x&&x.markedDone){v+=" 🟡";c="mark"}
  if(x&&x.feedback)v+=" 💬";
  return {t:v,c};
}

// Menu: my board, my course page with its LSs (the ones I can open) and English Lab. The teacher and testers get both courses.
const COURSES={"2eso":"2 ESO","4eso":"4 ESO"};
const lsHref=l=>`${l.course}/${l.id.slice(l.course.length+1)}/index.html`,lsName=l=>esc(l.title.replace(/^\S+ · /,""));
function nav(g,lss){
  const cs=all()?Object.keys(COURSES):g&&COURSES[g.course]?[g.course]:[];
  const html=`<a class="nv on" href="today.html" aria-current="page">${t("Les meves activitats","My activities")}</a>`
    +cs.map(c=>`<a class="nv" href="${c}/index.html">${t("El meu curs","My course")} · ${COURSES[c]}</a>`+lss.filter(l=>l.course===c).map(l=>`<a class="nv sub" href="${lsHref(l)}">${lsName(l)}</a>`).join("")).join("")
    +`<a class="nv" href="lab/">English Lab</a>`;
  document.querySelectorAll(".nvs,.nvs-m").forEach(n=>n.innerHTML=html);
}
// "Go to my Learning Situations": one big button per LS the student can open (open LS first).
const lsGo=lss=>lss.length?`<div class="box lsgo"><h2>${t("Les meves Learning Situations","My Learning Situations")}</h2><div class="row">${lss.map(l=>`<a class="go" href="${lsHref(l)}">${t("Ves a","Go to")} ${lsName(l)} →</a>`).join("")}</div></div>`:"";
function render(){
  const g=EL_GROUPS.find(x=>x.id===D.me.group);
  const lss=[...EL_LS].filter(l=>{const i=D.ls[l.id]||{status:"hidden"};return all()||(i.status!=="hidden"&&elLsForGroup(l,i,D.me.group))})
    .sort((a,b)=>((D.ls[b.id]||{}).status==="open")-((D.ls[a.id]||{}).status==="open"));   // open LS first
  // the board opens on the group's current LS by the time plan (ELWeek.now; Roger, 27 Oct 2026), else the first open one
  // ?ls=…#exam: the "exam results are ready" card (el-exam-notice.js) opens the board on that LS with the exam by criteria open
  if(S.ls==null&&!S.url){S.url=true;const p=new URLSearchParams(location.search).get("ls");if(p&&lss.some(l=>l.id===p))S.ls=p}
  if(lss.length&&!lss.some(l=>l.id===S.ls))S.ls=(lss.find(l=>l.id===(ELWeek.now(D.me.group)||{}).ls)||lss[0]).id;
  setLang();
  // every LS gets its button and menu link, also one whose board shows only its grade (LS1), so students can revise its pages (Roger, 30 Oct 2026)
  const links=lss;
  nav(g,links);
  // The course the student clicked on Home (el_pick): if it is not theirs, say which one is.
  let pick=null;try{pick=localStorage.getItem("el_pick");localStorage.removeItem("el_pick")}catch(e){}
  if(pick&&g&&COURSES[pick]&&pick!==g.course&&!all())S.pick=pick;
  const note=S.pick?t(`Has triat ${COURSES[S.pick]}, però ets de ${g.name}. Aquí tens les activitats del teu curs.`,`You chose ${COURSES[S.pick]}, but you are in ${g.name}. Here are the activities of your course.`):"";
  $("#note").innerHTML=`<div id="live">${liveBox()}</div>`+(note?`<div class="pend" style="background:#fffbeb;border-color:#fcd34d">${esc(note)}</div>`:"")+lsGo(links)+`<div id="ptbox">${pointsBox()}</div>`;
  $("#sub").textContent=(g?g.name+" · ":"")+(lss.length?t("El professor fa el seguiment de totes les activitats que fas. Algunes s'avaluaran i seran la teva avaluació contínua, que és una part de la nota.","Your teacher keeps track of all the activities you do. Some of them will be assessed and make up your continuous assessment, which is part of your mark."):t("Encara no tens cap LS assignada. El professor t'avisarà quan puguis començar.","You don't have any LS yet. Your teacher will tell you when you can start."));
  if(!lss.length){$("#main").innerHTML="";return}
  const ls=EL_LS.find(l=>l.id===S.ls);COURSE=ls.course;const info=D.ls[ls.id]||{status:"hidden",enabled:[]},list=EL_CATALOG.filter(a=>a.ls===ls.id),st=info.status;
  S.pend=[];lss.forEach(l=>EL_CATALOG.filter(a=>a.ls===l.id).forEach(a=>{const r=D.rs[a.id]||{};if(a.graded&&!a.manual&&r.markedDone&&!r.locked&&(D.ls[l.id]||{}).status==="open")S.pend.push(a)}));
  const stTag=st==="closed"?`<span class="tag">${t("tancada · només consulta","closed · view only")}</span>`:st==="hidden"?`<span class="tag">${t("oculta (només tu la veus)","hidden (only you can see it)")}</span>`:"";
  const n=S.pend.length;
  $("#main").innerHTML=lateBox(lss)+secBox(lss)+(n?`<div class="pend"><div><b>${n>1?t(`Tens ${n} activitats marcades com a fetes sense entregar:`,`You have ${n} activities marked as done but not submitted:`):t("Tens 1 activitat marcada com a feta sense entregar:","You have 1 activity marked as done but not submitted:")}</b><div class="muted">${S.pend.map(a=>a.title).join(" · ")}</div></div><button class="sub" data-do="suball">${t("Entrega-les","Submit them")}</button></div>`:"")
    +`<div class="bar">${lss.map(l=>`<button class="chip ${l.id===ls.id?"on":""}" data-do="ls" data-ls="${l.id}">${l.title}</button>`).join("")} <span class="muted">· ${t("El teu nivell:","Your level:")}</span> ${route(elRouteOf(D.lv,ls.id).level)}${routeNote(ls.id,st)} ${stTag}</div>`
    +studyBox(ls)+weekBox(ls,info)
    +(only(ls.id)?onlyView(ls.id):`<div class="tabs"><button class="tab ${S.view==="lp"?"on":""}" data-do="view" data-v="lp">Learning paths</button><button class="tab ${S.view==="sum"?"on":""}" data-do="view" data-v="sum">${t("Resum dels meus criteris","Summary of my criteria")}</button></div>`
    +(S.view==="sum"?summary(list):lpView(list,info)));
}
// Points (Roger, 25–26 Oct 2026; shared/js/el-points.js): my points this term from the class presentations and the bonus they add to
// my term grade so far (up to EL_POINTS_BONUS, in proportion to the best student of my group), and the rules.
function pointsBox(){
  // best = the best student of my group with all the work done (teams/{group}.bestOk, kept by the dashboard; Roger, 30 Oct 2026),
  // or the best of everyone while the dashboard has not saved it yet
  const p=D.pt||{},tm=D.tm||{},ok=tm.bestOk||{},bestOf=id=>Math.max(ok[id]!=null?+ok[id]:+(tm.best||{})[id]||0,+p[id]||0);
  const missOf=id=>all()?[]:elMissing(D.me.group,id,isDone,ls=>D.ls[ls]);
  if(!EL_TERMS.some(x=>+p[x.id]>0)&&!bestOf(elTerm()))return "";   // no points in my group yet
  const L=lang(),term=elTerm(),mine=+p[term]||0,best=bestOf(term),miss=missOf(term),bonus=miss.length?0:elBonus(mine,best);
  const past=EL_TERMS.filter(x=>x.id<term&&+p[x.id]>0).map(x=>`${elTermName(x.id,L)}: ${p[x.id]} ${t("punts","points")} → +${elNum(missOf(x.id).length?0:elBonus(+p[x.id],bestOf(x.id)),L)}`);

  return `<div class="box"><div class="lphead"><h2>${t("La meva nota mitjana","My average mark")}</h2><b style="font-size:1.6rem;color:${avg==null?"#94a3b8":col(avg*10)}">${avg==null?"–":f(avg)+" / 10"}</b></div><p class="muted">${t(`Mitjana de les notes de cada criteri que ja té activitats avaluades (${marked.length} de ${rows.length}). És orientativa: la nota final la posa el professor.`,`Average of the marks of each criterion that already has graded activities (${marked.length} of ${rows.length}). It is only a guide: your teacher gives the final mark.`)}</p></div>`
    +`<div class="box"><h2>${t("Els meus criteris","My criteria")}</h2><div class="wrap"><table class="legend sum"><thead><tr><th>${t("Criteri","Criterion")}</th><th style="text-align:left">${t("Què vol dir","What it means")}</th><th>${t("Punts","Points")}</th><th>${t("Nota","Mark")}</th></tr></thead><tbody>`
    +rows.map(r=>`<tr><td>${pill(r.c)}</td><td><b>${esc(elCompetence(r.c))}</b><br><small>${esc(elCriterion(COURSE,r.c)||"–")}</small><br><small class="muted">${list.filter(a=>a.graded&&a.criteria.includes(r.c)).map(a=>esc(a.title)).join(" · ")}</small></td><td>${r.m?r.s+"/"+r.m:"–"}</td><td><b style="color:${r.mark==null?"#94a3b8":col(r.mark*10)}">${r.mark==null?t("encara no","not yet"):f(r.mark)}</b></td></tr>`).join("")
    +`</tbody></table></div><p class="muted">${t("Cada nota és la suma de punts de les activitats avaluables lligades al criteri, sobre 10. El producte final compta amb la nota que posa el professor.","Each mark is the sum of the points of the graded activities linked to the criterion, out of 10. The final product counts with the mark your teacher gives.")}</p></div>`;
}
// Criteria that appear in a learning path's grid: its own and those of its steps.
const gridCrits=a=>[...new Set([...a.criteria,...steps(a).filter(k=>!(a.skip||[]).includes(k)).flatMap(k=>((window.EL_STEP_CRITERIA||{})[a.id]||{})[k]||EL_EVIDENCE[k]||[])])].sort();
function legend(cs){if(!cs.length)return "";
  return `<details class="crit"><summary>${t("Criteris d'avaluació d'aquest learning path","Assessment criteria of this learning path")}</summary><table class="legend"><tbody>${cs.map(c=>`<tr><td>${pill(c)}</td><td><b>${esc(elCompetence(c))}</b><br>${esc(elCriterion(COURSE,c)||"–")}</td></tr>`).join("")}</tbody></table></details>`}
function critPanel(c){
  const list=EL_CATALOG.filter(a=>a.ls===S.ls),lp=list.filter(a=>a.criteria.includes(c)),st=list.flatMap(a=>steps(a).filter(k=>!(a.skip||[]).includes(k)&&stepCrit(a,k).includes('data-c="'+c+'"')).map(k=>a.title+" · "+k));
  $("#dlgc").innerHTML=`<h3>${pill(c)} ${esc(elCompetence(c))}</h3><p>${esc(elCriterion(COURSE,c)||t("Encara no hi ha el text d'aquest criteri.","This criterion has no text yet."))}</p><label>${t("Learning paths que el treballen","Learning paths that work on it")}</label><p>${lp.map(a=>esc(a.title)).join(" · ")||"–"}</p><label>${t("Activitats que en donen evidència","Activities that give evidence of it")}</label><p>${st.map(esc).join(" · ")||"–"}</p><div class="row"><button class="g" data-do="close">${t("Tanca","Close")}</button></div>`;
  if(!$("#dlg").open)$("#dlg").showModal();
}
// Detail of one learning path: steps, score, feedback, final-product self-assessment with the teacher's answers.
function detail(id){
  const a=EL_CATALOG.find(x=>x.id===id),x=D.rs[id]||{},d=doneSet(a),info=D.ls[a.ls]||{status:"hidden",enabled:[]},can=canDo(a,info);
  const state=x.locked?t("✔ Entregada","✔ Submitted"):x.markedDone?t("🟡 Marcada com a feta, sense entregar","🟡 Marked as done, not submitted"):a.graded?t("Encara no l'has entregada","You have not submitted it yet"):t("No avalua (per practicar)","Not assessed (for practice)");
  let sp={};try{sp=JSON.parse((D.pg[a.ls]||{})[a.keys[0]]||"{}").steps||{}}catch(e){}
  const rp=x.replies||{};
  $("#dlgc").innerHTML=`<h3>${a.title}</h3><p class="muted">${a.criteria.map(pill).join("")} · ${pts(a)}</p><p><b>${state}</b>${a.graded&&!a.manual?` · ${x.score||0}/${a.points}`:""}${a.manual&&x.max?` · ${t("nota","mark")} ${x.score}/${x.max}`:""}</p>`
    +(steps(a).length?`<table><thead><tr><th style="text-align:left">${t("Activitat","Activity")}</th><th>${t("Criteri","Criterion")}</th><th>${t("Feta","Done")}</th></tr></thead><tbody>${steps(a).map(k=>`<tr><td style="text-align:left">${k}</td><td>${stepCrit(a,k)}</td><td>${d.has(k)?"✔":"–"}</td></tr>`).join("")}</tbody></table>`:"")
    +(x.feedback?`<label>${t("Feedback del professor","Teacher's feedback")}</label><div class="fb">${esc(x.feedback)}</div>`:"")
    +(a.steps?`<label>${t("Les meves autoavaluacions","My self-assessments")}</label>`+a.steps.map(([sid,tt])=>{const h=sp[sid];if(!h)return `<div class="hand muted">${esc(tt)} · ${t("encara no entregat","not handed in yet")}</div>`;
      return `<div class="hand"><b>${esc(tt)}</b>${h.avg!=null?` · ${t("autoavaluació","self-assessment")} ${h.avg}/4`:""}${h.comment?`<p>${t("El meu comentari:","My comment:")} ${esc(h.comment)}</p>`:""}${rp[sid]?`<div class="ans">💬 <b>${t("Resposta del professor:","Teacher's answer:")}</b> ${esc(rp[sid])}</div>`:h.comment&&!elNoComment(h.comment)&&!(x.seen||{})[sid]?`<p class="muted">${t("El professor encara no t'ha respost.","Your teacher has not answered yet.")}</p>`:""}</div>`}).join(""):"")
    +(a.manual&&a.graded?`<p class="muted">${t("Aquesta activitat es lliura pel Google Classroom i la puntua el professor.","This activity is handed in through Google Classroom and marked by your teacher.")}</p>`:"")
    +`<div class="row"><button class="g" data-do="close">${t("Tanca","Close")}</button><a class="go ${can?"":"off"}" href="${a.path}" style="padding:6px 12px;font-size:14px">${info.status==="closed"?t("Revisa","Review"):t("Obre","Open")}</a>${a.graded&&!a.manual&&info.status==="open"&&can&&!x.locked?`<button class="sub" data-do="submit" data-a="${a.id}">${t("Entrega","Submit")}</button>`:""}</div>`;
  if(!$("#dlg").open)$("#dlg").showModal();
}
async function submitMany(list){if(!confirm(t("Entregar: ","Submit: ")+list.map(a=>a.title).join(", ")+t("? Un cop entregades ja no es podran modificar.","? Once submitted, they can no longer be changed.")))return;if(DEMO)return alert(t("Vista prèvia: no s'entrega res.","Preview: nothing is submitted."));for(const a of list)await ELCloud.submitActivity(a);location.reload()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-do]");if(!el)return;const k=el.dataset,a=EL_CATALOG.find(x=>x.id===k.a);
  ({ls:()=>{S.ls=k.ls;render()},view:()=>{S.view=k.v;render()},    crit:()=>critPanel(k.c),cell:()=>detail(k.a),close:()=>$("#dlg").close(),ask:askPanel,want:()=>want(k.r),send:sendAsk,submit:()=>submitMany([a]),suball:()=>submitMany(S.pend)})[k.do]?.()});

if(DEMO){U={uid:"demo"};D=DEMO;render()}
else ELCloud.onUser(async u=>{U=u;
  if(!u){nav(null,[]);$("#sub").textContent="Entra amb el teu correu de l’institut i la contrasenya (botó de baix a la dreta) per veure les teves activitats. · Sign in with your school email and password (button at the bottom right) to see your activities.";$("#main").innerHTML="";return}
  D=await load(u);render();goLive();if(location.hash==="#exam")setTimeout(()=>document.getElementById("exam")?.scrollIntoView({block:"start"}),0)});
</script></body></html>
