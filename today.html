<script type="module">
// Student board: the same grid the teacher sees, for this student only (one row).
// Language (Roger, 25 Oct 2026): Catalan for Insecure, English for Safe and Daring, by the student's route in the LS on screen
// (any LS while it has none; Catalan while there is no route at all). The teacher and testers see it in English.
// Demo mode: a page that defines window.EL_DEMO_STUDENT before this script gets sample data and no Firebase.
const DEMO=window.EL_DEMO_STUDENT;let F=null;
if(!DEMO){await import("./shared/js/el-cloud.js");F=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")}
import {annHtml,annDate,annMs,annLast,annThreadHtml,annReplyForm,annWireReply,ANN_COLOR} from "./shared/js/el-announce.js";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let EN=false;const t=(ca,en)=>EN?en:ca;
let COURSE=null;   // course of the LS on screen: criteria texts depend on it
// Simple words first (el-criteria-easy.js, Roger 1 Nov 2026); the official text stays in the criterion dialog.
const easy=c=>elCriterionEasy(COURSE,c,EN)||elCriterion(COURSE,c)||"–";
const pill=c=>`<span class="pill ce${c[0]}" data-do="crit" data-c="${c}" tabindex="0" title="${esc(elCompetence(c)+" · "+c+": "+easy(c))}">${c}</span>`;
const LV=Object.fromEntries(EL_LEVELS.map(l=>[l.id,l.name]));
const route=l=>l?`<span class="route r-${l}">${LV[l]||l}</span>`:"–";
// what the student reads as their level: course, route and CEFR, e.g. "2ESO Starter (A1)" (Roger, 31 Oct 2026; elLevelLabel in el-catalog.js)
const levelTag=(c,l)=>l?`<span class="route r-${l}" title="${esc(elCefr(c,l,true))}">${esc(elLevelLabel(c,l))}</span>`:"–";
const steps=a=>EL_ACTIONS[a.id]||[];
const stepCrit=(a,k)=>(a.skip||[]).includes(k)?`<small class="muted">${t("no puntua","no points")}</small>`:((((window.EL_STEP_CRITERIA||{})[a.id]||{})[k]||EL_EVIDENCE[k]||[]).map(pill).join("")||`<small class="muted" title="${t("Pràctica de llengua: sense criteri","Language practice: no criterion")}">–</small>`);
const pts=a=>a.graded?(a.manual?t("nota del professor","teacher's mark"):a.points+(a.points===1?t(" punt"," point"):t(" punts"," points"))):t("no avalua","not assessed");
const col=p=>p>=90?"#8b5cf6":p>=75?"#2563eb":p>=50?"#16a34a":"#94a3b8";
const S={ls:null,view:"lp",pend:[]};let U=null,D=null;   // view: lp = one grid per learning path · sum = summary of my criteria

// D = {me:{name,group}, rs:{activity:result}, lv:{ls:{level}}, pg:{ls:data}, ls:{id:{status,enabled,groups,open,secLocked}}, pt:{team,t1,t2,t3}, tm:{list,score,best}}
// The teacher can open any student's board as the student sees it, read-only (Roger, 1 Nov 2026: "teacher should be able to see their
// reports, all of them"): today.html?student={uid} from the 📄 links on the dashboard. Nothing is written in that view.
let AS=null;
// TX: the teacher's extras on a student's board (every tab, "counted" tags, marks per rubric row, teacher notes). Off since Roger asked
// on 7 Nov 2026: "I need to see what students really see": the student view is exactly the student's board, with a red frame (el-cloud.js).
const TX=null;
async function load(u){
  if(DEMO)return DEMO;
  const sid=AS||u.uid,db=ELCloud.db,D={me:{},rs:{},lv:{},pg:{},ls:{}},q=async(p,f)=>{try{(await F.getDocs(F.collection(db,...p))).forEach(f)}catch(e){}};
  try{const s=await F.getDoc(F.doc(db,"students",sid));if(s.exists())D.me=s.data()}catch(e){}
  const mail=(AS?D.me.email||"":u.email||"").toLowerCase();
  D.me.name=D.me.name||(AS?mail:u.displayName||u.email);
  if(!AS&&ELCloud.viewGroup())D.me.group=ELCloud.viewGroup();   // tester in the student view of a group
  // the student's own results and levels: the reads el-cloud.js shares with the page's cards (one each; results fresh from the server here)
  if(!AS&&ELCloud.results){try{for(const r of Object.values(await ELCloud.results(true)))if(r&&r.activity)D.rs[r.activity]=r}catch(e){}
    try{Object.assign(D.lv,await ELCloud.levels())}catch(e){}}
  else{await q(["students",sid,"results"],r=>D.rs[r.data().activity]=r.data());
  await q(["students",sid,"levels"],l=>D.lv[l.id]=l.data())}
  await q(["students",sid,"progress"],p=>D.pg[p.id]=p.data().data||{});
  elInjectCorrected(D.pg,D.rs);   // steps the teacher corrected count as done (el-catalog.js; in memory only)
  for(const l of EL_LS)D.ls[l.id]=await ELCloud.lsInfo(l.id);
  try{const p=await F.getDoc(F.doc(db,"points",mail));if(p.exists())D.pt=p.data()}catch(e){}
  if(D.me.group)try{const t=await F.getDoc(F.doc(db,"teams",D.me.group));if(t.exists())D.tm=t.data()}catch(e){}
  if(!AS)try{D.ann=await ELCloud.announcements()}catch(e){console.warn("announcements",e)}
  return D;
}
const all=()=>!DEMO&&!AS&&(ELCloud.isTeacher(U)||(ELCloud.isTester(U)&&!ELCloud.viewGroup()));   // teacher and testers see every LS (not in a group's student view)
function setLang(){
  const lv=elRouteOf(D.lv,S.ls).level||(Object.values(D.lv).find(x=>x&&x.level)||{}).level;
  EN=all()||(!!lv&&!elCa(lv));
  document.documentElement.lang=EN?"en":"ca";
  // the teacher's student view: the student's language goes with el_as, so the LS pages opened from here draw in it at once (el-ls-home.js, el-app.js)
  if(AS&&lv)try{const A=JSON.parse(sessionStorage.getItem("el_as")||"null");if(A&&A.uid===AS&&A.ca!==!EN){A.ca=!EN;sessionStorage.setItem("el_as",JSON.stringify(A))}}catch(e){}
  document.title=t("El meu tauler","My dashboard")+" · English Lab";   // Roger, 6 Nov 2026: "it's not my activities but my dashboard"
  $("h1").textContent=t("El meu tauler","My dashboard");
}
const doneSet=a=>{const p=D.pg[a.ls]||{},s=new Set();a.keys.forEach(k=>elDoneSet(p[k]).forEach(x=>s.add(x)));return s};
// a step of a section the teacher has not opened yet for the group (elSecLocked; a vocabulary section holds the cards and practice steps)
const secOff=(a,info,k)=>{if(info.status==="closed"||all())return false;const off=elSecLockedFor(a,info,D.me.group,doneSet(a));return off.includes(k)||((k==="cards"||k==="practice")&&off.includes("vocab"))};
// learning paths the teacher has opened for the group (elLpOpen in el-catalog.js); a closed LS can be reviewed
const canDo=(a,info)=>info.status==="closed"||all()||elLpOpen(a,info,D.me.group);
// the steps a student sees of a path: done or in a section open for them; never a count that gives away what is still closed (Roger, 7 Nov 2026)
const visSteps=(a,info)=>{const ds=doneSet(a);return TX?steps(a):steps(a).filter(k=>ds.has(k)||(canDo(a,info)&&!secOff(a,info,k)))};
function cell(a){
  const x=D.rs[a.id],d=doneSet(a);let v,c="";
  if(a.manual)v=x&&x.max?x.score+"/"+x.max:"–";
  else if(a.graded){const y=elScore(a,x,D.pg[a.ls]);v=y?y.score+"/"+y.max:"–"}
  else{const n=steps(a).filter(k=>d.has(k)).length;v=steps(a).length?n+"/"+steps(a).length:"–";c="na"}
  // ✅ + green only with every step done (Roger, 4 Nov 2026); pressing Submit / Mark as done is only a small note
  if(!a.manual&&elAllDone(a,d,x)){v+=" ✅";c=c?c+" sub":"sub"}
  if(x&&x.feedback)v+=" 💬";
  return {t:v,c};
}

// Menu: my board, my course page with its LSs (the ones I can open), Games and Practise. The teacher and testers get both courses.
const COURSES={"2eso":"2 ESO","4eso":"4 ESO"};
const lsHref=l=>`${l.course}/${l.id.slice(l.course.length+1)}/index.html`,lsName=l=>esc(elLsName(l));
function nav(g,lss){
  const cs=all()?Object.keys(COURSES):g&&COURSES[g.course]?[g.course]:[];
  // the same menu as every other student page: elStudentMenu in shared/js/el-catalog.js (Roger, 7 Nov 2026: "this should always be the same")
  const pl=placeNow(),here={home:"board",books:"books",lang:"lang",help:"help",phone:"phone"}[pl]||"";
  if(!all())try{localStorage.setItem("el_menu_ls",JSON.stringify(lss.map(l=>l.id)))}catch(e){}   // the other pages show the same LSs
  const html=elStudentMenu({root:"",courses:cs,lss,ca:lang()==="ca",board:location.search||"today.html",here,app:APP()});
  document.querySelectorAll(".nvs,.nvs-m").forEach(n=>n.innerHTML=html);
}
// "How English Lab works" (Roger, 31 Oct 2026): a 5-minute video for students, in English (Amelia) and Catalan (Julian), made by
// tools/site-video (real screens of the site, no subtitles). A box on the board and a link in the menu.
const HOWTO="video/how-english-lab-works",HOWTO_V="20261102c";   // change HOWTO_V when the videos are rebuilt, so browsers fetch the new file
// One video per language (Roger, 2 Nov 2026: "this videos could be merged … the original video with the changes"): the website
// video now holds the whole board, part by part, on a sample student (tools/site-video/full.json).
const vidRow=(icon,ca,en,dca,den,f,v)=>`<div class="hv"><div><b>${icon} ${t(ca,en)}</b> <span class="muted">· ${t(dca,den)}</span></div>`
  +`<div class="row"><a class="go" href="${f}.mp4?v=${v}" target="_blank" rel="noopener">▶️ English</a> <a class="go" href="${f}-ca.mp4?v=${v}" target="_blank" rel="noopener">▶️ Català</a></div></div>`;
const howBox=()=>`<div class="pend howto" style="background:#f5f3ff;border-color:#c4b5fd;flex-direction:column;align-items:stretch;gap:10px">`
  +vidRow("🎬","Com funciona English Lab","How English Lab works","vídeo de 13 minuts: el tauler part per part, les Learning Situations, els learning paths i com moure't per la web","12-minute video: your board part by part, Learning Situations, learning paths and how to move around the website",HOWTO,HOWTO_V)+`</div>`;
// Simple board (Roger, 6 Nov 2026: "the menus have little information and when you go to a place you can find the info that you need";
// the students work on Chromebooks; the site is for self-study and for class): the board opens on a home with only the class bar
// (📌 pulled-up path, live presentation), one Continue button to the next step and four places. Each place keeps the boxes that were on
// the board: ✅ To do (what the teacher has opened and I haven't finished, my activities, what we've done) and 🏠 Homework (only what the
// teacher set as homework, and the calendar; Roger, 6 Nov 2026), 📊 My marks (the 📈 / 🎬 / 📝 tabs and
// the points), 📚 Learning Situations (open an LS, level, summaries, practice) and ❓ Help (video, problems). A place is a hash
// (#todo, #homework, #marks, #units, #help, #news; the old #formative, #final, #exam and #week open their place), so Back returns home.
const PLACE_OF={todo:"todo",homework:"hw",week:"todo",marks:"marks",formative:"marks",final:"marks",exam:"marks",units:"units",help:"help",news:"news",phone:"phone",books:"books",language:"lang"};
const placeNow=()=>PLACE_OF[location.hash.slice(1)]||"home";
const placeTitle=p=>({todo:t("Per fer","To do"),hw:t("Deures","Homework"),marks:t("Les meves notes","My marks"),units:"Learning Situations",help:t("Ajuda","Help"),news:t("Anuncis del professor","Announcements from your teacher"),phone:t("Estudia amb el mòbil","Study on your phone"),books:"📖 "+t("Llibres","Books"),lang:"🔤 "+t("Gramàtica i vocabulari","Grammar and vocabulary")})[p];
// the first name: "Surname Surname, Name" on the student list, else the first word
const hello=()=>{const n=String(D.me.name||"").trim(),f=n.includes(",")?n.split(",")[1].trim().split(/\s+/)[0]:n.split(/[\s@]+/)[0];const end=window.ELCheer?ELCheer.student(D.me.email||D.me.name||"",ELWeek.today(),EN):t("espero que tinguis un dia genial! ☺️","hope you are having a great day! ☺️");
  return t("Hola","Hi")+(f?" "+f:"")+", "+end};   // Roger, 6 Nov 2026: a new encouraging sentence every day, different for each student (el-cheer.js)
const planOf=ls=>{const p=(window.EL_PLAN||{})[ls.id],gi=p&&D.me.group?ELWeek.col(p,D.me.group):-1;return {p,gi:p?gi:-1}};
function homeSub(g,ls){const {p,gi}=planOf(ls),ex=gi>=0?ELWeek.exam(p,gi):null,n=ex?ELWeek.days(ELWeek.today(),ex):null;
  return (g?esc(g.name)+" · ":"")+lsName(ls)+(ex&&n>=0?` · <b style="color:#b91c1c">${n>1?t(`examen d'aquí a ${n} dies`,`exam in ${n} days`):n===1?t("examen demà","exam tomorrow"):t("examen avui","exam today")}</b>`:"")}
// the student's next step: the first open learning path (in the order of the group's plan) with a step still to do, as on 📋 My learning paths
function nextFor(ls,info){if(only(ls.id)||info.status==="closed")return null;
  const {p,gi}=planOf(ls),dr=(gi>=0&&(p._dropped||{})[gi])||[],today=ELWeek.today(),dueOf=a=>gi>=0?ELWeek.due(p,a.id,gi):null;
  const rows=EL_CATALOG.filter(a=>a.ls===ls.id).map((a,i)=>({a,i,d:dueOf(a)})).sort((x,y)=>(x.d||"~")<(y.d||"~")?-1:(x.d||"~")>(y.d||"~")?1:x.i-y.i);
  for(const {a,d} of rows){if(a.manual||dr.includes(a.id)||!canDo(a,info)||isDone(a))continue;
    const cp=!TX&&elCheckpointMissing(a,doneSet,y=>canDo(y,info));if(cp)return {a:cp,cp:true};
    const ds=doneSet(a),ks=visSteps(a,info),k=ks.find(x=>!ds.has(x)&&!(a.skip||[]).includes(x)&&!secOff(a,info,x));if(k===undefined)continue;
    const gs=tabGroups(a,ks);return {a,k,nm:tabName(a.id,k),done:gs.filter(g=>g.every(x=>ds.has(x))).length,total:gs.length,late:!!(d&&d<today)}}
  return null}
function homeHtml(lss,ls,info){

function fbBox(txt,act){const L=String(txt||"").split("\n"),parts=[],com=[],H=/^(.+?) \((\d+(?:[.,]\d+)?) ?%\) · ([\d.,]+) ?\/ ?10\s*$/;let cur=null;

    +(x.feedback?`<label>${t("Feedback del professor","Teacher's feedback")}</label><div class="fb">${esc(x.feedback)}</div>`:"")
    +(a.steps?`<label>${t("Les meves autoavaluacions","My self-assessments")}</label>`+a.steps.map(([sid,tt])=>{const h=sp[sid];if(!h)return `<div class="hand muted">${esc(tt)} · ${t("encara no entregat","not handed in yet")}</div>`;
      return `<div class="hand"><b>${esc(tt)}</b>${h.avg!=null?` · ${t("autoavaluació","self-assessment")} ${h.avg}/4`:""}${h.comment?`<p>${t("El meu comentari:","My comment:")} ${esc(h.comment)}</p>`:""}${ans(sid)?`<div class="ans">💬 <b>${t("Resposta del professor:","Teacher's answer:")}</b> ${esc(ans(sid))}</div>`:h.comment&&!elNoComment(h.comment)&&!(x.seen||{})[sid]?`<p class="muted">${t("El professor encara no t'ha respost.","Your teacher has not answered yet.")}</p>`:""}</div>`}).join(""):"")
    // the teacher's corrections of this path's steps (writing, speaking, Talk, logs…: results.replies; the final product's are listed above)
    +(()=>{const own=new Set((a.steps||[]).map(([sid])=>sid)),cs=Object.entries(rp).filter(([k,v])=>v&&!own.has(k));
      return cs.length?`<label>${t("Correccions del professor","Your teacher's corrections")}</label>`+cs.map(([k,v])=>`<div class="ans">✏️ <b>${esc(({write:t("Escriptura","Writing"),speak:"Speaking",talk:"Talk",reflect:t("Reflexió","Reflection")})[k]||k)}:</b> ${esc(v)} <a href="${a.path.split("/").map(encodeURIComponent).join("/")}#${encodeURIComponent(k)}">${t("Obre","Open")} →</a></div>`).join(""):""})()
    +(a.manual&&a.graded?`<p class="muted">${t("Aquesta activitat es lliura pel Google Classroom i la puntua el professor.","This activity is handed in through Google Classroom and marked by your teacher.")}</p>`:"")
    +`<div class="row"><button class="g" data-do="close">${t("Tanca","Close")}</button><a class="go ${can?"":"off"}" href="${a.path}" style="padding:6px 12px;font-size:14px">${info.status==="closed"?t("Revisa","Review"):t("Obre","Open")}</a></div>`;
  if(!$("#dlg").open)$("#dlg").showModal();
}
// The LS's learning paths in one table, in the order of the group's time plan: each tab done (✔, amber when done after its day, from the
// page state doneAt against stepDue/due) or missing (red once its day has passed), the state and the score. Every tab not done is a link
// that opens that tab (path#panel, el-cloud.js openHashTab), and "👉 Next" proposes the first one to do (Roger, 2 Nov 2026: "you can click
// the learning paths you haven't done yet and it proposes them to you"). Students get it too, without the teacher's "counted" tag
// (AGENTS.md: students are never told which activities count); the teacher's view (?student=…) adds it.
const stateOf=a=>{try{return JSON.parse((D.pg[a.ls]||{})[a.keys[0]]||"{}")}catch(e){return {}}};
const ymd=v=>{const d=new Date(v);return isNaN(d)?"":d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
// the panel a step lives in: its own, or the vocabulary panel for the cards and practice steps (elSecSteps)
const panelOf=(a,k)=>{const xs=(window.EL_SECTIONS||{})[a.id]||[];return xs.some(x=>x[0]===k)?k:(k==="cards"||k==="practice")&&xs.some(x=>x[0]==="vocab")?"vocab":k};
const tabHref=(a,k)=>a.path.split("/").map(encodeURIComponent).join("/")+(k?"#"+encodeURIComponent(panelOf(a,k)):"");
function lpStatus(ls,list,info){if(only(ls.id)||!list.length||(!TX&&all()))return "";
  const p=(window.EL_PLAN||{})[ls.id],gi=p&&D.me.group?ELWeek.col(p,D.me.group):-1,today=ELWeek.today(),dr=(gi>=0&&(p._dropped||{})[gi])||[],open=info.status!=="closed";
  const counted=new Set(TX&&D.me.group?elDueWork(D.me.group,elTerm(),l=>D.ls[l]).map(([a])=>a.id):[]);
  const dueOf=a=>gi>=0?ELWeek.due(p,a.id,gi):null,stepDue=(a,k)=>{const sd=p&&p.stepDue&&p.stepDue[a.id]&&p.stepDue[a.id][k];return (sd&&sd[gi])||dueOf(a)};
  const rows=list.map((a,i)=>({a,i,d:dueOf(a)})).sort((x,y)=>(x.d||"~")<(y.d||"~")?-1:(x.d||"~")>(y.d||"~")?1:x.i-y.i);
  const n={done:0,miss:0,todo:0,off:0};let next=null;
  const body=rows.map(({a,d})=>{const ds=doneSet(a),at=stateOf(a).doneAt||{},drop=dr.includes(a.id),cp=!TX&&open&&canDo(a,info)&&elCheckpointMissing(a,doneSet,y=>canDo(y,info)),can=canDo(a,info)&&!cp;
    if(!TX&&!can&&!ds.size&&!D.rs[a.id])return "";   // students never see a learning path they cannot open yet (Roger, 7 Nov 2026: "they mustn't see that anything is locked")
    const vis=steps(a).filter(k=>TX||ds.has(k)||(can&&!secOff(a,info,k)));   // students: only the tabs they have done or can open
    if(!TX&&steps(a).length&&!vis.length)return "";   // open, but none of its sections yet
    const done=!a.manual&&isDone(a),x=D.rs[a.id]||{},late=!a.manual&&!done&&can&&!drop&&d&&d<today&&!steps(a).some(k=>secOff(a,info,k)),go=can&&!drop&&!done&&!a.manual&&open;
    const tabs=tabGroups(a,steps(a)).map(g=>{const k=g.find(x=>!ds.has(x))||g[g.length-1],sk=g.every(x=>(a.skip||[]).includes(x)),sd=stepDue(a,k),nm=tabName(a.id,k),off=secOff(a,info,k);
      if(g.every(x=>ds.has(x))){const w=g.map(x=>at[x]?ymd(at[x]):"").sort().pop()||"",lt=w&&sd&&w>sd;return `<span class="stp ${lt?"lt":"ok"}" title="${esc(nm)}: ${t("fet","done")}${w?" "+w:""}${lt?t(" (després del seu dia, "," (after its day, ")+sd+")":""}">✔ ${esc(nm)}</span>`}
      if(!g.some(x=>vis.includes(x)))return "";
      const past=!sk&&can&&!drop&&sd&&sd<today,ln=go&&!off;
      if(ln&&!sk&&!next)next={a,k,nm,past};
      const tip=`${esc(nm)}: ${t("no fet","not done")}${sk?t(" (sense punts)"," (no points)"):""}${off?t(" (encara no està oberta)"," (not open yet)"):""}${sd?" · "+t("fins al","by")+" "+sd:""}${ln?" · "+t("clica per obrir-la","click to open it"):""}`;
      const lbl=`${off?"🔒":past?"✗":"·"} ${esc(nm)}`;
      return ln?`<a class="stp go2 ${past?"no":""}" href="${tabHref(a,k)}" title="${tip}">${lbl} →</a>`:`<span class="stp ${past?"no":""} ${off||sk?"off":""}" title="${tip}">${lbl}</span>`}).join("");
    const vg=tabGroups(a,vis),hand=vis.length?`<small class="muted">${vg.filter(g=>g.every(k=>ds.has(k))).length} / ${vg.length} ${vg.length===1?t("pestanya","tab"):t("pestanyes","tabs")}</small><br>`:"";
    let st;
    if(drop){st=`<span class="s-off">✂ ${t("No compta (no hi vam tenir temps)","Dropped · not counted")}</span>`;n.off++}
    else if(a.manual){st=x.max?`<span class="s-ok">✔ ${t("Corregit","Marked")}</span>`:`<span class="s-off">${t("Es lliura al Classroom","Handed in on Classroom")}</span>`}
    else if(done){st=`<span class="s-ok">✔ ${t("Fet","Done")}${x.locked?t(" · entregat"," · submitted"):""}</span>`;n.done++}
    else if(!can&&!TX){st=`<span class="s-off">${t("Fet en part","Partly done")}</span>`}   // students: one they did some of and can't open now, no lock
    else if(cp){st=`<span class="s-off">🔒 ${t(`Primer fes ${esc(cp.title)}`,`First do ${esc(cp.title)}`)}</span>`;n.off++}
    else if(!can){st=`<span class="s-off">🔒 ${t("Encara no està oberta","Not open yet")}</span>`;n.off++}
    else if(late){st=`<span class="s-no">⏰ ${t("Falta · calia fer-la el","Missing · was due")} ${when(d)}</span>`;n.miss++}
    else{st=`<span class="s-td">${t("Per fer","To do")}${d?" · "+t("fins al","by")+" "+when(d):""}</span>`;n.todo++}
    const c=cell(a);if(vis.length<steps(a).length&&!a.graded&&!a.manual)c.t=vis.filter(k=>ds.has(k)).length+"/"+vis.length+(x.feedback?" 💬":"");
    const title=can?`<a href="${tabHref(a)}">${esc(a.title)}</a>`:esc(a.title);
    return `<tr class="${late?"miss":""}"><td class="l"><b>${title}</b>${a.criteria.length?`<br>${a.criteria.filter(c=>/^\d/.test(c)).map(pill).join("")}`:""}${counted.has(a.id)?` <span class="tag" title="Its day has passed: it is in “X of Y done this term”">counted</span>`:""}</td><td class="l">${st}</td><td class="l">${hand}${tabs||`<small class="muted">–</small>`}</td><td class="sc ${c.c}" data-do="cell" data-a="${a.id}" title="${t("Clica per veure'n el detall","Click to see the details")}">${c.t}</td></tr>`}).join("");
  if(!TX&&!body)return `<div class="box fv lps">${fvHead("🧭",t("Els meus learning paths: què he fet i què em falta","My learning paths: done and missing"),lsName(ls))}<p class="muted">${t("Aquí veuràs els learning paths que fem a classe.","The learning paths we do in class will appear here.")}</p></div>`;
  const due=[...counted].filter(id=>list.some(a=>a.id===id)),dn=due.filter(id=>isDone(list.find(a=>a.id===id))).length;
  const nx=next?`<div class="nextbox ${next.past?"late":""}"><div>👉 <b>${TX?"Next for this student":t("El següent que et toca","Next for you")}:</b> ${esc(next.a.title)} · <b>${esc(next.nm)}</b>${next.past?` <span class="s-no">· ${t("ja havia d'estar feta","it was due already")}</span>`:""}</div><a class="go" href="${tabHref(next.a,next.k)}">${t("Obre-la","Open it")} →</a></div>`
    :open?`<p class="ptok">✓ ${t("No tens res pendent als learning paths oberts. Molt bé!","Nothing left to do in the open learning paths. Well done!")}</p>`:"";
  return `<div class="box fv lps">${fvHead("🧭",t("Els meus learning paths: què he fet i què em falta","My learning paths: done and missing"),lsName(ls))}`
    +(TX?`<p class="tag" style="display:inline-block">👩‍🏫 Teacher view: the student sees this table without the “counted” tags.</p>`:`<p class="muted" style="margin:0 0 6px">${t("Clica una pestanya que et falta per anar-hi directament.","Click a tab you are missing to go straight to it.")}</p>`)
    +nx
    +`<div class="lpsum"><span>✔ ${n.done} ${t(n.done===1?"fet":"fets","done")}</span><span style="background:#fee2e2;color:#991b1b">⏰ ${n.miss} ${t(n.miss===1?"endarrerit":"endarrerits",n.miss===1?"missing past its day":"missing past their day")}</span><span>${n.todo} ${t("per fer","to do")}</span>${TX?`<span>🔒 ${n.off} not open</span>`:""}${TX?`<span>Counted so far: ${dn} of ${due.length} done</span>`:""}</div>`
    +`<div class="wrap"><table class="xt lpst"><thead><tr><th>Learning path</th><th>${t("Estat","State")}</th><th>${t("Pestanyes","Tabs")} <small class="muted">(✔ ${t("fet","done")} · <span style="color:#92400e">${t("taronja = després del seu dia","amber = after its day")}</span> · <span style="color:#991b1b">✗ ${t("falta i ja tocava","missing past its day")}</span>${TX?" · 🔒 not open":""})</small></th><th>${t("Punts","Score")}</th></tr></thead><tbody>${body}</tbody></table></div>`
    +(TX?`<p class="muted" style="margin:6px 0 0">“Counted” = its day in the time plan has passed, it is open and no section is still locked: these are the ones in “X of Y done this term” and in the bonus check. Click a score for the details, feedback and self-assessments.</p>`:"")+`</div>`}
// a step's name = the name of the tab it lives in, as on the learning path (Roger, 7 Nov 2026: "make sure students see the same" as the
// dashboard): the cards and practice steps are both the Vocabulary tab, never "Cards" or "Practice" (panelOf)
const tabName=(id,k)=>{const xs=(window.EL_SECTIONS||{})[id]||[],p=xs.some(y=>y[0]===k)?k:(k==="cards"||k==="practice")&&xs.some(y=>y[0]==="vocab")?"vocab":k,x=xs.find(y=>y[0]===p);return x?x[1]:k==="check"?"Checkpoint":k.charAt(0).toUpperCase()+k.slice(1)};
// steps grouped by their tab, in the path's order: [[step, …], …] (the Vocabulary tab holds two steps, done when both are)
const tabGroups=(a,ks)=>elTabGroups(a,ks);
async function submitMany(list){if(AS)return;if(!confirm(t("Entregar: ","Submit: ")+list.map(a=>a.title).join(", ")+t("? Un cop entregades ja no es podran modificar.","? Once submitted, they can no longer be changed.")))return;if(DEMO)return alert(t("Vista prèvia: no s'entrega res.","Preview: nothing is submitted."));for(const a of list)await ELCloud.submitActivity(a);location.reload()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-do]");if(!el)return;const k=el.dataset,a=EL_CATALOG.find(x=>x.id===k.a);
  ({ls:()=>{S.ls=k.ls;S.tab=null;render()},view:()=>{S.view=k.v;render()},tab:()=>{S.tab=k.t;S.tabLs=S.ls;try{history.replaceState(null,"",location.pathname+location.search+"#"+({form:"formative",fp:"final"}[k.t]||k.t))}catch(e){}render();document.querySelector(AS?".tabbody":".lscard")?.scrollIntoView({block:"start",behavior:"smooth"})},    crit:()=>critPanel(k.c),cell:()=>detail(k.a),close:()=>$("#dlg").close(),ask:()=>AS||askPanel(),want:()=>want(k.r),send:sendAsk,submit:()=>submitMany([a]),suball:()=>submitMany(S.pend)})[k.do]?.()});

addEventListener("hashchange",()=>{if(!D)return;S.tab=null;S.hashUsed=false;render();scrollTo(0,0)});   // a place of the board (placeNow)
addEventListener("el-ann-read",e=>{const a=D&&(D.ann||[]).find(x=>x.id===e.detail);if(a&&U){a.read=Object.assign({},a.read,{[U.uid]:Date.now()});render()}});
if(DEMO){U={uid:"demo"};D=DEMO;AS=DEMO.as||null;render();if(AS&&location.hash==="#exam")setTimeout(()=>document.querySelector(".tabbody")?.scrollIntoView({block:"start"}),0)}   // DEMO.as: preview the teacher's view of a student's board
else ELCloud.onUser(async u=>{U=u;
  // signed out: the welcome page, where everyone signs in (Roger, 7 Nov 2026); el_who is already gone, so it does not send them back here
  if(!u){location.replace("index.html");return}
  // the student view of this tab (el-cloud.js, el_as) keeps the board on that student when the URL has no ?student
  const sp=new URLSearchParams(location.search).get("student")||(ELCloud.viewing||{}).uid;AS=sp&&ELCloud.isTeacher(u)?sp:null;
  // the dashboard's 📝 next to a student (teacher.html notesLink): the student view is now on in this tab, so go on to that LS page (only an LS home)
  const go=new URLSearchParams(location.search).get("go");if(AS&&go&&/^(2|4)eso\/[\w-]+\/index\.html(#[\w-]+)?$/.test(go)){location.replace(go);return}
  D=await load(u);render();if(!AS)goLive();if(location.hash==="#exam")setTimeout(()=>document.querySelector(AS?".tabbody":"#exam")?.scrollIntoView({block:"start"}),0)});
</script></body></html>
