<div class="page"><h1>Les meves activitats</h1><p class="muted" id="sub">Carregant…</p><div id="note"></div><div id="main"></div></div></div>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<script src="shared/js/el-catalog.js"></script>
<script src="shared/js/el-sections.js"></script>
<script src="shared/js/el-criteria.js"></script>
<script src="shared/js/el-criteria-easy.js"></script>
<script src="shared/js/el-grading.js"></script>
<script src="shared/js/el-fp-rubrics.js"></script>

<script type="module">
// Student board: the same grid the teacher sees, for this student only (one row).
// Language (Roger, 25 Oct 2026): Catalan for Insecure, English for Safe and Daring, by the student's route in the LS on screen
// (any LS while it has none; Catalan while there is no route at all). The teacher and testers see it in English.
// Demo mode: a page that defines window.EL_DEMO_STUDENT before this script gets sample data and no Firebase.
const DEMO=window.EL_DEMO_STUDENT;let F=null;
if(!DEMO){await import("./shared/js/el-cloud.js");F=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")}
import {annHtml,annDate,annMs,ANN_COLOR} from "./shared/js/el-announce.js";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let EN=false;const t=(ca,en)=>EN?en:ca;
let COURSE=null;   // course of the LS on screen: criteria texts depend on it
// Simple words first (el-criteria-easy.js, Roger 1 Nov 2026); the official text stays in the criterion dialog.
const easy=c=>elCriterionEasy(COURSE,c,EN)||elCriterion(COURSE,c)||"–";
const pill=c=>`<span class="pill ce${c[0]}" data-do="crit" data-c="${c}" tabindex="0" title="${esc(elCompetence(c)+" · "+c+": "+easy(c))}">${c}</span>`;
const LV=Object.fromEntries(EL_LEVELS.map(l=>[l.id,l.name]));
const route=l=>l?`<span class="route r-${l}">${LV[l]||l}</span>`:"–";
// what the student reads as their level: course, route and CEFR, e.g. "2ESO Starter (A1)" (Roger, 31 Oct 2026; elLevelLabel in el-catalog.js)
const levelTag=(c,l)=>l?`<span class="route r-${l}" title="${esc(elCefr(c,l,true))}">${esc(elLevelLabel(c,l))}</span>`:"–";
const steps=a=>EL_ACTIONS[a.id]||[];
const stepCrit=(a,k)=>(a.skip||[]).includes(k)?`<small class="muted">${t("no puntua","no points")}</small>`:((((window.EL_STEP_CRITERIA||{})[a.id]||{})[k]||EL_EVIDENCE[k]||[]).map(pill).join("")||`<small class="muted" title="${t("Pràctica de llengua: sense criteri","Language practice: no criterion")}">–</small>`);
const pts=a=>a.graded?(a.manual?t("nota del professor","teacher's mark"):a.points+(a.points===1?t(" punt"," point"):t(" punts"," points"))):t("no avalua","not assessed");
const col=p=>p>=90?"#8b5cf6":p>=75?"#2563eb":p>=50?"#16a34a":"#94a3b8";
const S={ls:null,view:"lp",pend:[]};let U=null,D=null;   // view: lp = one grid per learning path · sum = summary of my criteria

// D = {me:{name,group}, rs:{activity:result}, lv:{ls:{level}}, pg:{ls:data}, ls:{id:{status,enabled,groups,open,secLocked}}, pt:{team,t1,t2,t3}, tm:{list,score,best}}
// The teacher can open any student's board as the student sees it, read-only (Roger, 1 Nov 2026: "teacher should be able to see their
// reports, all of them"): today.html?student={uid} from the 📄 links on the dashboard. Nothing is written in that view.
let AS=null;
async function load(u){
  if(DEMO)return DEMO;
  const sid=AS||u.uid,db=ELCloud.db,D={me:{},rs:{},lv:{},pg:{},ls:{}},q=async(p,f)=>{try{(await F.getDocs(F.collection(db,...p))).forEach(f)}catch(e){}};
  try{const s=await F.getDoc(F.doc(db,"students",sid));if(s.exists())D.me=s.data()}catch(e){}
  const mail=(AS?D.me.email||"":u.email||"").toLowerCase();
  D.me.name=D.me.name||(AS?mail:u.displayName||u.email);
  if(!AS&&ELCloud.viewGroup())D.me.group=ELCloud.viewGroup();   // tester in the student view of a group
  // the student's own results and levels: the reads el-cloud.js shares with the page's cards (one each; results fresh from the server here)
  if(!AS&&ELCloud.results){try{for(const r of Object.values(await ELCloud.results(true)))if(r&&r.activity)D.rs[r.activity]=r}catch(e){}
    try{Object.assign(D.lv,await ELCloud.levels())}catch(e){}}
  else{await q(["students",sid,"results"],r=>D.rs[r.data().activity]=r.data());
  await q(["students",sid,"levels"],l=>D.lv[l.id]=l.data())}
  await q(["students",sid,"progress"],p=>D.pg[p.id]=p.data().data||{});
  elInjectCorrected(D.pg,D.rs);   // steps the teacher corrected count as done (el-catalog.js; in memory only)
  for(const l of EL_LS)D.ls[l.id]=await ELCloud.lsInfo(l.id);
  try{const p=await F.getDoc(F.doc(db,"points",mail));if(p.exists())D.pt=p.data()}catch(e){}
  if(D.me.group)try{const t=await F.getDoc(F.doc(db,"teams",D.me.group));if(t.exists())D.tm=t.data()}catch(e){}
  if(!AS)try{D.ann=await ELCloud.announcements()}catch(e){console.warn("announcements",e)}
  return D;
}
const all=()=>!DEMO&&!AS&&(ELCloud.isTeacher(U)||(ELCloud.isTester(U)&&!ELCloud.viewGroup()));   // teacher and testers see every LS (not in a group's student view)
function setLang(){
  const lv=elRouteOf(D.lv,S.ls).level||(Object.values(D.lv).find(x=>x&&x.level)||{}).level;
  EN=all()||(!!lv&&!elCa(lv));
  document.documentElement.lang=EN?"en":"ca";
  document.title=t("Les meves activitats","My activities")+" · English Lab";
  $("h1").textContent=t("Les meves activitats","My activities");
}
const doneSet=a=>{const p=D.pg[a.ls]||{},s=new Set();a.keys.forEach(k=>elDoneSet(p[k]).forEach(x=>s.add(x)));return s};
// a step of a section the teacher has not opened yet for the group (elSecLocked; a vocabulary section holds the cards and practice steps)
const secOff=(a,info,k)=>{if(info.status==="closed"||all())return false;const off=elSecLockedFor(a,info,D.me.group,doneSet(a));return off.includes(k)||((k==="cards"||k==="practice")&&off.includes("vocab"))};
// learning paths the teacher has opened for the group (elLpOpen in el-catalog.js); a closed LS can be reviewed
const canDo=(a,info)=>info.status==="closed"||all()||elLpOpen(a,info,D.me.group);
function cell(a){
  const x=D.rs[a.id],d=doneSet(a);let v,c="";
  if(a.manual)v=x&&x.max?x.score+"/"+x.max:"–";
  else if(a.graded){const y=elScore(a,x,D.pg[a.ls]);v=y?y.score+"/"+y.max:"–"}
  else{const n=steps(a).filter(k=>d.has(k)).length;v=steps(a).length?n+"/"+steps(a).length:"–";c="na"}
  // ✅ + green only with every step done (Roger, 4 Nov 2026); pressing Submit / Mark as done is only a small note
  if(!a.manual&&elAllDone(a,d,x)){v+=" ✅";c=c?c+" sub":"sub"}
  if(x&&x.feedback)v+=" 💬";
  if(!a.manual&&x&&x.locked)v+=`<br><small class="muted">📤 ${t("entregada","submitted")}</small>`;else if(!a.manual&&x&&x.markedDone)v+=`<br><small class="muted">🟡 ${t("marcada com a feta","marked as done")}</small>`;
  return {t:v,c};
}

// Menu: my board, my course page with its LSs (the ones I can open) and English Lab. The teacher and testers get both courses.
const COURSES={"2eso":"2 ESO","4eso":"4 ESO"};
const lsHref=l=>`${l.course}/${l.id.slice(l.course.length+1)}/index.html`,lsName=l=>esc(l.title.replace(/^\S+ · /,""));
function nav(g,lss){
  const cs=all()?Object.keys(COURSES):g&&COURSES[g.course]?[g.course]:[];
  const html=`<a class="nv on" href="today.html" aria-current="page">${t("Les meves activitats","My activities")}</a>`
    +cs.map(c=>`<a class="nv" href="${c}/index.html">${t("El meu curs","My course")} · ${COURSES[c]}</a>`+lss.filter(l=>l.course===c).map(l=>`<a class="nv sub" href="${lsHref(l)}">${lsName(l)}</a>`).join("")).join("")
    +`<a class="nv" href="lab/">English Lab</a><a class="nv" href="lab/practice.html">${t("Practica","Practise")}</a>`
    +`<a class="nv" href="${HOWTO}${t("-ca","")}.mp4?v=${HOWTO_V}" target="_blank" rel="noopener">🎬 ${t("Com funciona la web","How the website works")}</a>`;
  document.querySelectorAll(".nvs,.nvs-m").forEach(n=>n.innerHTML=html);
}
// "How English Lab works" (Roger, 31 Oct 2026): a 5-minute video for students, in English (Amelia) and Catalan (Julian), made by
// tools/site-video (real screens of the site, no subtitles). A box on the board and a link in the menu.
const HOWTO="video/how-english-lab-works",HOWTO_V="20261102c";   // change HOWTO_V when the videos are rebuilt, so browsers fetch the new file
// One video per language (Roger, 2 Nov 2026: "this videos could be merged … the original video with the changes"): the website
// video now holds the whole board, part by part, on a sample student (tools/site-video/full.json).
const vidRow=(icon,ca,en,dca,den,f,v)=>`<div class="hv"><div><b>${icon} ${t(ca,en)}</b> <span class="muted">· ${t(dca,den)}</span></div>`
  +`<div class="row"><a class="go" href="${f}.mp4?v=${v}" target="_blank" rel="noopener">▶️ English</a> <a class="go" href="${f}-ca.mp4?v=${v}" target="_blank" rel="noopener">▶️ Català</a></div></div>`;
const howBox=()=>`<div class="pend howto" style="background:#f5f3ff;border-color:#c4b5fd;flex-direction:column;align-items:stretch;gap:10px">`
  +vidRow("🎬","Com funciona English Lab","How English Lab works","vídeo de 13 minuts: el tauler part per part, les Learning Situations, els learning paths i com moure't per la web","12-minute video: your board part by part, Learning Situations, learning paths and how to move around the website",HOWTO,HOWTO_V)+`</div>`;
function render(){
  const g=EL_GROUPS.find(x=>x.id===D.me.group);
  const lss=[...EL_LS].filter(l=>{const i=D.ls[l.id]||{status:"hidden"};return all()||(i.status!=="hidden"&&elLsForGroup(l,i,D.me.group))})
    .sort((a,b)=>((D.ls[b.id]||{}).status==="open")-((D.ls[a.id]||{}).status==="open"));   // open LS first
  // the board opens on the group's current LS by the time plan (ELWeek.now; Roger, 27 Oct 2026), else the first open one
  // ?ls=…#exam: the "exam results are ready" card (el-exam-notice.js) opens the board on that LS with the exam by criteria open
  if(S.ls==null&&!S.url){S.url=true;const p=new URLSearchParams(location.search).get("ls");if(p&&lss.some(l=>l.id===p))S.ls=p}
  if(lss.length&&!lss.some(l=>l.id===S.ls))S.ls=(lss.find(l=>l.id===(ELWeek.now(D.me.group)||{}).ls)||lss[0]).id;
  setLang();
  // every LS gets its button and menu link, also one whose board shows only its grade (LS1), so students can revise its pages (Roger, 30 Oct 2026)
  const links=lss;
  nav(g,links);
  // The course the student clicked on Home (el_pick): if it is not theirs, say which one is.
  let pick=null;try{pick=localStorage.getItem("el_pick");localStorage.removeItem("el_pick")}catch(e){}
  if(pick&&g&&COURSES[pick]&&pick!==g.course&&!all())S.pick=pick;
  const note=S.pick?t(`Has triat ${COURSES[S.pick]}, però ets de ${g.name}. Aquí tens les activitats del teu curs.`,`You chose ${COURSES[S.pick]}, but you are in ${g.name}. Here are the activities of your course.`):"";
  $("#note").innerHTML=`<div id="pull">${pullBox()}</div><div id="live">${liveBox()}</div>`+annBox()+(note?`<div class="pend" style="background:#fffbeb;border-color:#fcd34d">${esc(note)}</div>`:"")+`<div id="ptbox">${pointsBox()}</div>`+workBox()+howBox();
  $("#sub").textContent=(g?g.name+" · ":"")+(lss.length?t("El professor fa el seguiment de totes les activitats que fas. Algunes s'avaluaran i seran la teva avaluació contínua, que és una part de la nota.","Your teacher keeps track of all the activities you do. Some of them will be assessed and make up your continuous assessment, which is part of your mark."):t("Encara no tens cap LS assignada. El professor t'avisarà quan puguis començar.","You don't have any LS yet. Your teacher will tell you when you can start."));
  if(!lss.length){$("#main").innerHTML="";return}
  const ls=EL_LS.find(l=>l.id===S.ls);COURSE=ls.course;const info=D.ls[ls.id]||{status:"hidden",enabled:[]},list=EL_CATALOG.filter(a=>a.ls===ls.id),st=info.status;
  S.pend=[];lss.forEach(l=>EL_CATALOG.filter(a=>a.ls===l.id).forEach(a=>{const r=D.rs[a.id]||{};if(a.graded&&!a.manual&&r.markedDone&&!r.locked&&(D.ls[l.id]||{}).status==="open")S.pend.push(a)}));
  const stTag=st==="closed"?`<span class="tag">${t("tancada · només consulta","closed · view only")}</span>`:st==="hidden"?`<span class="tag">${t("oculta (només tu la veus)","hidden (only you can see it)")}</span>`:"";
  const n=S.pend.length;
  $("#main").innerHTML=lateBox(lss)+(n?`<div class="pend"><div><b>${n>1?t(`Tens ${n} activitats marcades com a fetes sense entregar:`,`You have ${n} activities marked as done but not submitted:`):t("Tens 1 activitat marcada com a feta sense entregar:","You have 1 activity marked as done but not submitted:")}</b><div class="muted">${S.pend.map(a=>a.title).join(" · ")}</div></div><button class="sub" data-do="suball">${t("Entrega-les","Submit them")}</button></div>`:"")
    +lsCard(lss,ls,st,stTag)+tabBody(ls,list,info);
  if(AS)asBar(lss,ls);
}
// The LS report (Roger, 1 Nov 2026: "the idea is that I don't need to make [the LS1 reports] again since all the info could be on their
// student board"): a big LS picker and three tabs per LS. 🗓 My week (plan, homework, summary, practice), 📈 My formative assessment
// (the learning-path grids and the summary of my criteria) and 📝 My exams (the LS grade, the exam per part and per criterion and the
// exam report: questions to review, the writing with its rubric and corrections, what to review). The exam is only on its tab
// (today.html#exam, also the link of the "results are ready" card); #formative and #week open the other two.
const TABS=["week","form","fp","exam"];
function tabOf(ls){const h=location.hash.slice(1),m={exam:"exam",formative:"form",week:"week",final:"fp"}[h];if(m==="fp"&&!hasFp(ls))m="form";
  if(S.tab&&S.tabLs===ls.id)return S.tab;S.tabLs=ls.id;
  if(m&&!S.hashUsed){S.hashUsed=true;return S.tab=m}
  return S.tab=only(ls.id)||(D.ls[ls.id]||{}).status==="closed"?"exam":"form"}   // 📈 My formative assessment is the main tab (Roger, 2 Nov 2026)
const hasWeek=ls=>{const p=(window.EL_PLAN||{})[ls.id];return !only(ls.id)||!!(p&&ELWeek.col(p,D.me.group)>=0&&ELWeek.span(p))};
function lsCard(lss,ls,st,stTag){const tab=tabOf(ls),st2=l=>{const s=(D.ls[l.id]||{}).status;return s==="closed"?t("tancada · per repassar","closed · to revise"):s==="hidden"?t("oculta","hidden"):t("ara","now")};
  const tb=(id,icon,ca,en,sub)=>`<button class="btab b-${id} ${tab===id?"on":""}" data-do="tab" data-t="${id}"><span class="bi">${icon}</span><span><b>${t(ca,en)}</b><small>${sub}</small></span></button>`;
  return `<div class="box lscard"><h2>${t("Les meves Learning Situations","My Learning Situations")}</h2>`
    +`<div class="lspick">${lss.map(l=>`<button class="lsbtn ${l.id===ls.id?"on":""}" data-do="ls" data-ls="${l.id}"><small>${esc(l.title.split(" · ")[0])} · ${st2(l)}</small>${lsName(l)}</button>`).join("")}</div>`
    +`<div class="lvline"><span class="muted">${t("El teu nivell:","Your level:")}</span> ${levelTag(ls.course,elRouteOf(D.lv,ls.id).level)}${routeNote(ls.id,st)} ${stTag} <a class="go lsopen" href="${lsHref(ls)}">${t("Ves a","Go to")} ${lsName(ls)} →</a></div>`
    +`<div class="btabs" role="tablist">`
    +tb("form","📈","La meva avaluació formativa","My formative assessment",t("activitats dels learning paths","learning-path activities"))
    +(hasWeek(ls)?only(ls.id)?tb("week","🗓","La meva setmana","My week",t("pla, deures i estudi","plan, homework and study")):tb("week","✅","Què hem fet","What we've done",t("a classe, deures i estudi","in class, homework and study")):"")
    +(hasFp(ls)?tb("fp","🎬","El meu producte final","My final product",fpSub(ls)):"")
    +tb("exam","📝","Els meus exàmens","My exams",examSub(ls))+`</div></div>`}
function examSub(ls){const x=(D.rs[ls.id+"/assessment"]||{}).sections||{};return Object.values(x).some(y=>y&&y.score!=null)?t("resultats i informe","results and report"):t("encara no hi ha resultats","no results yet")}
function tabBody(ls,list,info){const tab=tabOf(ls);
  if(tab==="week")return `<div class="tabbody">${studyBox(ls)+practiceBox(ls)+weekBox(ls,info)||`<p class="muted">${t("Aquesta LS no té pla setmanal.","This LS has no week plan.")}</p>`}</div>`;
  if(tab==="fp"&&hasFp(ls))return `<div class="tabbody t-fp">${fpView(ls,info)}</div>`;
  if(tab==="exam")return `<div class="tabbody t-exam">${examView(ls)}</div>`;   // the mark so far and the learning paths are on 📈 (Roger, 2 Nov 2026)
  return `<div class="tabbody t-form"><div class="fhead"><h2>📈 ${t("La meva avaluació formativa","My formative assessment")} <small>· ${lsName(ls)}</small></h2><p>${t("Totes les activitats dels learning paths, el que has fet i la teva puntuació. Mira-ho sovint: és la teva feina de cada dia.","All the learning-path activities, what you have done and your score. Check it often: it is your everyday work.")}</p></div>`+lpStatus(ls,list,info)+progressBox(ls)
    +(only(ls.id)?onlyForm(ls.id):summary(list))+`</div>`}   // the old per-path grids are gone: the table on top has the same and more (Roger, 2 Nov 2026)
// Announcements from the teacher (Roger, 31 Oct 2026; shared/js/el-announce.js): the ones sent to my group or to me, newest first.
// Each one also comes once as a card at the top of the next page I open; here they stay so I can read them again.
function annBox(){
  const me=U&&U.uid,L=[...(D.ann||[])].filter(a=>String(a.text||"").trim()).sort((a,b)=>annMs(b.created)-annMs(a.created));if(!L.length)return "";
  const recent=L.filter((a,i)=>i<3||Date.now()-annMs(a.created)<7*864e5).slice(0,5),older=L.slice(recent.length);
  const li=a=>`<li><small class="muted">${esc(annDate(a.created,EN))}${me&&!(a.read||{})[me]?` · <b style="color:${ANN_COLOR}">${t("Nou","New")}</b>`:""}</small><div class="annt">${annHtml(a.text)}</div></li>`;
  return `<div class="box ann"><h2>📣 ${t("Anuncis del professor","Announcements from your teacher")}</h2><ul>${recent.map(li).join("")}</ul>`
    +(older.length?`<details><summary class="muted">${t(`Anuncis anteriors (${older.length})`,`Older announcements (${older.length})`)}</summary><ul>${older.map(li).join("")}</ul></details>`:"")+`</div>`}
// Points (Roger, 25–26 Oct 2026; shared/js/el-points.js): my points this term from the class presentations and the bonus they add to
// my term grade so far (up to EL_POINTS_BONUS, in proportion to the best student of my group), and the rules.
function pointsBox(){
  // best = the best student of my group with all the work done (teams/{group}.bestOk, kept by the dashboard; Roger, 30 Oct 2026),
  // or the best of everyone while the dashboard has not saved it yet
  const p=D.pt||{},tm=D.tm||{},ok=tm.bestOk||{},bestOf=id=>Math.max(ok[id]!=null?+ok[id]:+(tm.best||{})[id]||0,+p[id]||0);
  const missOf=id=>all()?[]:elMissing(D.me.group,id,isDone,ls=>D.ls[ls]);

const stateOf=a=>{try{return JSON.parse((D.pg[a.ls]||{})[a.keys[0]]||"{}")}catch(e){return {}}};
const ymd=v=>{const d=new Date(v);return isNaN(d)?"":d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
// the panel a step lives in: its own, or the vocabulary panel for the cards and practice steps (elSecSteps)
const panelOf=(a,k)=>{const xs=(window.EL_SECTIONS||{})[a.id]||[];return xs.some(x=>x[0]===k)?k:(k==="cards"||k==="practice")&&xs.some(x=>x[0]==="vocab")?"vocab":k};
const tabHref=(a,k)=>a.path.split("/").map(encodeURIComponent).join("/")+(k?"#"+encodeURIComponent(panelOf(a,k)):"");
function lpStatus(ls,list,info){if(only(ls.id)||!list.length||(!AS&&all()))return "";
  const p=(window.EL_PLAN||{})[ls.id],gi=p&&D.me.group?ELWeek.col(p,D.me.group):-1,today=ELWeek.today(),dr=(gi>=0&&(p._dropped||{})[gi])||[],open=info.status!=="closed";
  const counted=new Set(AS&&D.me.group?elDueWork(D.me.group,elTerm(),l=>D.ls[l]).map(([a])=>a.id):[]);
  const dueOf=a=>gi>=0?ELWeek.due(p,a.id,gi):null,stepDue=(a,k)=>{const sd=p&&p.stepDue&&p.stepDue[a.id]&&p.stepDue[a.id][k];return (sd&&sd[gi])||dueOf(a)};
  const rows=list.map((a,i)=>({a,i,d:dueOf(a)})).sort((x,y)=>(x.d||"~")<(y.d||"~")?-1:(x.d||"~")>(y.d||"~")?1:x.i-y.i);
  const n={done:0,miss:0,todo:0,off:0};let next=null;
  const body=rows.map(({a,d})=>{const ds=doneSet(a),at=stateOf(a).doneAt||{},drop=dr.includes(a.id),cp=!AS&&open&&canDo(a,info)&&elCheckpointMissing(a,doneSet,y=>canDo(y,info)),can=canDo(a,info)&&!cp;
    const done=!a.manual&&isDone(a),x=D.rs[a.id]||{},late=!a.manual&&!done&&can&&!drop&&d&&d<today,go=can&&!drop&&!done&&!a.manual&&open;
    const tabs=steps(a).map(k=>{const sk=(a.skip||[]).includes(k),sd=stepDue(a,k),nm=tabName(a.id,k),off=secOff(a,info,k);
      if(ds.has(k)){const w=at[k]?ymd(at[k]):"",lt=w&&sd&&w>sd;return `<span class="stp ${lt?"lt":"ok"}" title="${esc(nm)}: ${t("fet","done")}${w?" "+w:""}${lt?t(" (després del seu dia, "," (after its day, ")+sd+")":""}">✔ ${esc(nm)}</span>`}
      const past=!sk&&can&&!drop&&sd&&sd<today,ln=go&&!off;
      if(ln&&!sk&&!next)next={a,k,nm,past};
      const tip=`${esc(nm)}: ${t("no fet","not done")}${sk?t(" (sense punts)"," (no points)"):""}${off?t(" (encara no està oberta)"," (not open yet)"):""}${sd?" · "+t("fins al","by")+" "+sd:""}${ln?" · "+t("clica per obrir-la","click to open it"):""}`;
      const lbl=`${off?"🔒":past?"✗":"·"} ${esc(nm)}`;
      return ln?`<a class="stp go2 ${past?"no":""}" href="${tabHref(a,k)}" title="${tip}">${lbl} →</a>`:`<span class="stp ${past?"no":""} ${off||sk?"off":""}" title="${tip}">${lbl}</span>`}).join("");
    const hand=steps(a).length?`<small class="muted">${steps(a).filter(k=>ds.has(k)).length} / ${steps(a).length} ${steps(a).length===1?t("pestanya","tab"):t("pestanyes","tabs")}</small><br>`:"";
    let st;
    if(drop){st=`<span class="s-off">✂ ${t("No compta (no hi vam tenir temps)","Dropped · not counted")}</span>`;n.off++}
    else if(a.manual){st=x.max?`<span class="s-ok">✔ ${t("Corregit","Marked")}</span>`:`<span class="s-off">${t("Es lliura al Classroom","Handed in on Classroom")}</span>`}
    else if(done){st=`<span class="s-ok">✔ ${t("Fet","Done")}${x.locked?t(" · entregat"," · submitted"):""}</span>`;n.done++}
    else if(cp){st=`<span class="s-off">🔒 ${t(`Primer fes ${esc(cp.title)}`,`First do ${esc(cp.title)}`)}</span>`;n.off++}
    else if(!can){st=`<span class="s-off">🔒 ${t("Encara no està oberta","Not open yet")}</span>`;n.off++}
    else if(late){st=`<span class="s-no">⏰ ${t("Falta · calia fer-la el","Missing · was due")} ${when(d)}</span>`;n.miss++}
    else{st=`<span class="s-td">${t("Per fer","To do")}${d?" · "+t("fins al","by")+" "+when(d):""}</span>`;n.todo++}
    const c=cell(a),title=can?`<a href="${tabHref(a)}">${esc(a.title)}</a>`:esc(a.title);
    return `<tr class="${late?"miss":""}"><td class="l"><b>${title}</b>${a.criteria.length?`<br>${a.criteria.filter(c=>/^\d/.test(c)).map(pill).join("")}`:""}${counted.has(a.id)?` <span class="tag" title="Its day has passed: it is in “X of Y done this term”">counted</span>`:""}</td><td class="l">${st}</td><td class="l">${hand}${tabs||`<small class="muted">–</small>`}</td><td class="sc ${c.c}" data-do="cell" data-a="${a.id}" title="${t("Clica per veure'n el detall","Click to see the details")}">${c.t}</td></tr>`}).join("");
  const due=[...counted].filter(id=>list.some(a=>a.id===id)),dn=due.filter(id=>isDone(list.find(a=>a.id===id))).length;
  const nx=next?`<div class="nextbox ${next.past?"late":""}"><div>👉 <b>${AS?"Next for this student":t("El següent que et toca","Next for you")}:</b> ${esc(next.a.title)} · <b>${esc(next.nm)}</b>${next.past?` <span class="s-no">· ${t("ja havia d'estar feta","it was due already")}</span>`:""}</div><a class="go" href="${tabHref(next.a,next.k)}">${t("Obre-la","Open it")} →</a></div>`
    :open?`<p class="ptok">✓ ${t("No tens res pendent als learning paths oberts. Molt bé!","Nothing left to do in the open learning paths. Well done!")}</p>`:"";
  return `<div class="box"><h2>📋 ${t("Els meus learning paths: què he fet i què em falta","My learning paths: done and missing")} <small class="muted">· ${lsName(ls)}</small></h2>`
    +(AS?`<p class="tag" style="display:inline-block">👩‍🏫 Teacher view: the student sees this table without the “counted” tags.</p>`:`<p class="muted" style="margin:0 0 6px">${t("Clica una pestanya que et falta per anar-hi directament.","Click a tab you are missing to go straight to it.")}</p>`)
    +nx
    +`<div class="lpsum"><span>✔ ${n.done} ${t(n.done===1?"fet":"fets","done")}</span><span style="background:#fee2e2;color:#991b1b">⏰ ${n.miss} ${t(n.miss===1?"endarrerit":"endarrerits",n.miss===1?"missing past its day":"missing past their day")}</span><span>${n.todo} ${t("per fer","to do")}</span><span>🔒 ${n.off} ${t(n.off===1?"tancat":"tancats","not open")}</span>${AS?`<span>Counted so far: ${dn} of ${due.length} done</span>`:""}</div>`
    +`<div class="wrap"><table class="xt lpst"><thead><tr><th>Learning path</th><th>${t("Estat","State")}</th><th>${t("Pestanyes","Tabs")} <small class="muted">(✔ ${t("fet","done")} · <span style="color:#92400e">${t("taronja = després del seu dia","amber = after its day")}</span> · <span style="color:#991b1b">✗ ${t("falta i ja tocava","missing past its day")}</span> · 🔒 ${t("tancada","not open")})</small></th><th>${t("Punts","Score")}</th></tr></thead><tbody>${body}</tbody></table></div>`
    +(AS?`<p class="muted" style="margin:6px 0 0">“Counted” = its day in the time plan has passed, it is open and no section is still locked: these are the ones in “X of Y done this term” and in the bonus check. Click a score for the details, feedback and self-assessments.</p>`:"")+`</div>`}
const tabName=(id,k)=>{const x=((window.EL_SECTIONS||{})[id]||[]).find(y=>y[0]===k);return x?x[1]:k.charAt(0).toUpperCase()+k.slice(1)};
async function submitMany(list){if(AS)return;if(!confirm(t("Entregar: ","Submit: ")+list.map(a=>a.title).join(", ")+t("? Un cop entregades ja no es podran modificar.","? Once submitted, they can no longer be changed.")))return;if(DEMO)return alert(t("Vista prèvia: no s'entrega res.","Preview: nothing is submitted."));for(const a of list)await ELCloud.submitActivity(a);location.reload()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-do]");if(!el)return;const k=el.dataset,a=EL_CATALOG.find(x=>x.id===k.a);
  ({ls:()=>{S.ls=k.ls;S.tab=null;render()},view:()=>{S.view=k.v;render()},tab:()=>{S.tab=k.t;S.tabLs=S.ls;try{history.replaceState(null,"",location.pathname+location.search+"#"+({form:"formative",fp:"final"}[k.t]||k.t))}catch(e){}render();document.querySelector(AS?".tabbody":".lscard")?.scrollIntoView({block:"start",behavior:"smooth"})},    crit:()=>critPanel(k.c),cell:()=>detail(k.a),close:()=>$("#dlg").close(),ask:()=>AS||askPanel(),want:()=>want(k.r),send:sendAsk,submit:()=>submitMany([a]),suball:()=>submitMany(S.pend)})[k.do]?.()});

addEventListener("el-ann-read",e=>{const a=D&&(D.ann||[]).find(x=>x.id===e.detail);if(a&&U){a.read=Object.assign({},a.read,{[U.uid]:Date.now()});render()}});
if(DEMO){U={uid:"demo"};D=DEMO;AS=DEMO.as||null;render();if(AS&&location.hash==="#exam")setTimeout(()=>document.querySelector(".tabbody")?.scrollIntoView({block:"start"}),0)}   // DEMO.as: preview the teacher's view of a student's board
else ELCloud.onUser(async u=>{U=u;
  if(!u){nav(null,[]);$("#sub").textContent="Entra amb el teu correu de l’institut i la contrasenya (botó de baix a la dreta) per veure les teves activitats. · Sign in with your school email and password (button at the bottom right) to see your activities.";$("#main").innerHTML="";return}
  // the student view of this tab (el-cloud.js, el_as) keeps the board on that student when the URL has no ?student
  const sp=new URLSearchParams(location.search).get("student")||(ELCloud.viewing||{}).uid;AS=sp&&ELCloud.isTeacher(u)?sp:null;
  D=await load(u);render();if(!AS)goLive();if(location.hash==="#exam")setTimeout(()=>document.querySelector(AS?".tabbody":"#exam")?.scrollIntoView({block:"start"}),0)});
