<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les meves activitats · English Lab</title>
<style>body{font:16px system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#f8fafc;color:#0f172a}h1{font-size:1.5rem}h2{font-size:1.15rem;margin-top:1.4em}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:12px;background:#ecfdf5;color:#065f46;border-radius:999px;padding:2px 8px;margin-right:4px}.pill.o{background:#eff6ff;color:#1d4ed8}a.go{background:#0f766e;color:#fff;text-decoration:none;border-radius:8px;padding:6px 12px;white-space:nowrap}a.go.off{background:#94a3b8;pointer-events:none}.muted{color:#64748b;font-size:14px}.fb{background:#fffbeb;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:14px}.bar{position:relative;height:18px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:6px 0 2px}.bar>i{display:block;height:100%;border-radius:999px;transition:width .6s,background .3s}.bar>u{position:absolute;top:0;bottom:0;width:1px;background:#fff9}.tot{display:block}</style></head><body>
<h1>Les meves activitats</h1><p class="muted" id="sub">Carregant…</p><div id="list"></div>
<script src="shared/js/el-catalog.js"></script>
<script type="module">
import "./shared/js/el-cloud.js";
import {getDocs,collection,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
ELCloud.onUser(async u=>{
  if(!u){$("#sub").textContent="Entra amb el compte del col·le (botó de baix a la dreta) per veure les teves activitats.";$("#list").innerHTML="";return}
  const db=ELCloud.db,results={};
  try{(await getDocs(collection(db,"students",u.uid,"results"))).forEach(r=>results[r.data().activity]=r.data())}catch(e){}
  let html="",any=false;
  for(const ls of EL_LS){
    const info=await ELCloud.lsInfo(ls.id),st=info.status;
    if(st==="hidden"&&!ELCloud.isTeacher(u))continue;
    any=true;
    let lvl="";try{const l=await getDoc(doc(db,"students",u.uid,"levels",ls.id));if(l.exists())lvl=l.data().level}catch(e){}
    const items=EL_CATALOG.filter(a=>a.ls===ls.id);
    let ts=0,tm=0;items.forEach(a=>{const r=results[a.id];if(a.graded&&r&&r.max){ts+=r.score||0;tm+=r.max}});
    html+=`<h2>${ls.title} ${lvl?`<span class="pill">${lvl}</span>`:""}${st==="closed"?'<span class="pill o">tancada · només consulta</span>':st==="hidden"?'<span class="pill o">oculta (només tu la veus)</span>':st==="public"?'<span class="pill o">accés lliure · no puntua</span>':""}</h2>`;
    html+=items.map(a=>{const r=results[a.id]||{},can=st==="closed"||!a.graded||info.enabled.includes(a.id)||ELCloud.isTeacher(u);
      const pts=a.manual?(r.max?` · nota ${r.score}/${r.max}`:" · es lliura pel Classroom i la puntua el professor"):a.graded?` · ${r.score||0}/${a.points} punts`:"";
      return `<div class="card"><div><b>${a.title}</b><div>${a.criteria.map(c=>`<span class="pill">${c}</span>`).join("")}${a.graded?"":'<span class="pill o">'+(a.inClass?"a classe · no avalua":"per practicar · no avalua")+'</span>'}${a.mode==="once"?'<span class="pill o">una sola vegada</span>':""}<span class="muted">${r.locked?"entregada":""}${pts}${a.graded&&!can?" · el professor la habilitarà":""}</span></div>${r.feedback?`<div class="fb"><b>Feedback:</b> ${esc(r.feedback)}</div>`:""}</div><a class="go ${can?"":"off"}" href="${a.path}">${st==="closed"?"Revisa":"Obre"}</a></div>`}).join("");
    if(tm){const p=ts/tm*100,col=p>=90?"#8b5cf6":p>=75?"#2563eb":p>=50?"#16a34a":"#94a3b8";
      html+=`<div class="card tot"><div style="display:flex;justify-content:space-between"><b>Total ${ls.title}</b><b>${ts} / ${tm} (${Math.round(p)}%)</b></div><div class="bar"><i data-w="${p}" style="width:0;background:${col}"></i><u style="left:50%"></u><u style="left:75%"></u><u style="left:90%"></u></div><span class="muted">Verd al 50% · blau al 75% · lila al 90%. El percentatge es calcula amb les activitats que has fet.</span></div>`}
  }
  $("#sub").textContent=any?"Pots practicar quan vulguis. El professor et dirà a classe quan fer les activitats avaluables.":"Encara no hi ha cap LS oberta. El professor t'avisarà quan puguis començar.";
  $("#list").innerHTML=html;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar>i").forEach(i=>i.style.width=i.dataset.w+"%")));
});
</script></body></html>
