// Firestore times come back from IndexedDB as plain {seconds, nanoseconds}: give them toMillis/toDate again
const revive=o=>{if(!o||typeof o!=="object")return o;if(Array.isArray(o)){o.forEach(revive);return o}
  const k=Object.keys(o);if(k.length===2&&typeof o.seconds==="number"&&typeof o.nanoseconds==="number"){o.toMillis=function(){return this.seconds*1e3+Math.floor(this.nanoseconds/1e6)};o.toDate=function(){return new Date(this.toMillis())};return o}
  k.forEach(x=>revive(o[x]));return o};

$("#dlg").addEventListener("close",()=>redraw=null);
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)e.target.open?S.open.add(k):S.open.delete(k)},true);
document.addEventListener("change",e=>{const t=e.target,k=t.dataset;
  if(k.do==="agmin"){const x=planX(k.ls,k.gid);if(!agOf(x))return;let v=t.value;
    if(v==="other"){v=Math.round(+String(prompt("Minutes for this in class (1–120):","")||"").replace(",","."));if(!(v>=1&&v<=120)){render();return}}
    v=+v||0;agSave(x,g=>{g.min=Object.assign({},g.min);const q=k.d+"|"+k.it;if(v)g.min[q]=v;else delete g.min[q]});return}
  if(k.tt){const d=ttDraft();TTE.msg="";
    if(k.tt==="day"||k.tt==="time"){const row=t.closest(".ttslot"),dy=row.querySelector("select").value,[h,m]=(row.querySelector("input").value||"08:30").split(":");d.groups[k.gid][+k.i]=dy+" "+(+h)+":"+m}
    else if(k.tt==="len"){const v=Math.round(+t.value);if(v>=20&&v<=180)d.len=v}
    else if(k.tt==="from"||k.tt==="to"){const o=d.off[+k.i],v=t.value;if(v){if(k.tt==="from"){o[0]=v;if(o[1]<v)o[1]=v}else{o[1]=v;if(o[0]>v)o[0]=v}}}
    render();return}
  if(k.do==="import"&&t.files[0])importList(t.files[0]).catch(x=>alert("Could not read the file: "+x.message)).finally(()=>t.value="");
  if(k.do==="ls"){S.year=t.value===YEAR;if(!S.year)S.ls=t.value;render()}
  if(k.do==="qals"){S.qa.ls=t.value;S.qa.g="all";S.qa.f.act="all";render()}
  if(k.do==="qaf"){S.qa.f[k.f]=t.value;S.qa.f.all=false;render()}
  if(k.do==="group"&&t.value)act(api.setGroup(k.u,t.value)).then(()=>$("#dlg").open&&stuPanel(k.u));
  if(k.do==="rtto"){S.rtTo=t.value;S.rtPick={};S.rtOn={};render()}
  if(k.do==="rtpick"){S.rtPick[k.u]=t.value;delete S.rtOn[k.u];render()}
  if(k.do==="cut"){const c=GR.find(g=>g.id===S.g).course,o=cutsOf(c),v=+t.value;if(t.value===""||isNaN(v)||v<0||v>10)return render();o[k.k]=v;
    if(!(o.beginners<=o.insecure&&o.insecure<=o.safe)){alert("The cut-offs must go up: Starter ≤ Base ≤ Core.");return render()}quick(api.cuts(c,o))}
  if(k.do==="setroute"&&t.value)act(api.setLevel(k.u,S.ls,t.value)).then(()=>stuPanel(k.u))});

// the teacher's 🔔 (shared/js/el-bell.js): "All reports" lands on #probs and one report on #pb-<id> (from another page), or it sends
// el-probs (detail = the report's id) on this page; the list is reloaded and that report is shown in the middle, lit up for a moment
const toProbs=async id=>{if(!S.D)return;try{await api.pbLoad()}catch(e){console.warn("problems",e)}S.open.add("probs");S.place="msgs";render();
  const r=id&&document.getElementById("pb-"+id),b=r||$("#probs");if(!b)return;b.scrollIntoView({behavior:"smooth",block:r?"center":"start"});
  if(r&&r.animate)r.animate([{background:"#fef3c7"},{background:"#fef3c7",offset:.6},{background:"transparent"}],{duration:2200})};
addEventListener("el-probs",e=>toProbs(e.detail));
const hashPb=()=>{const h=location.hash;return h==="#probs"?"":h.startsWith("#pb-")?decodeURIComponent(h.slice(4)):null};
// While the data comes in, the page says so (it used to stay blank under "Hello"); if a read fails, it says that too, with a Try again button.
// Optional practice is never locked (elLpLocks; Roger, 9 Nov 2026: the sample exam always open): a group whose saved ls/{id}.locked list
// still holds one (saved before) is written again once, so firestore.rules let students save their answers in it.
function optHeal(D){if(DEMO||!D||!D.ls)return;const ps=[];
  Object.entries(D.ls).forEach(([ls,info])=>Object.entries((info&&info.locked)||{}).forEach(([g,ids])=>{
    if(!Array.isArray(ids)||!ids.some(id=>elOptional(byId(id))))return;const op=(info.open||{})[g];ps.push(api.lpOpen(ls,g,Array.isArray(op)?op:[]))}));
  if(ps.length)Promise.all(ps).catch(e=>console.warn("optHeal",e))}
const start=async(hello)=>{$("#app").hidden=false;$("#msg").textContent=hello;if(!S.D)$("#main").innerHTML='<p class="muted" id="loading">⏳ Loading your groups and students…</p>';
  try{S.D=await load();ttApply(S.D);optHeal(S.D)}catch(e){console.warn("load",e);if(!S.D){$("#main").innerHTML='<p><b>The dashboard could not load.</b> Check the connection and try again.</p><p><button id="retry">Try again</button></p>';$("#retry").onclick=()=>start(hello)}return}
  // the first time: during a class, open on its group, unless a link asked for a group, course or LS (then the bar asks)
  TOUCHED.clear();
  if(!CLS.ready){CLS.ready=true;const c=classNow();if(c&&CLS.done!==c.key&&!CLS.link&&S.g!==c.gid&&GR.some(g=>g.id===c.gid)){classGo(c);if(hashPb()!=null)toProbs(hashPb());return}}
  render();corrFresh();if(hashPb()!=null)toProbs(hashPb())};
// "Students' work in 2ESO B: as of 10:42" and the buttons that fetch it (load: "Update <group>" one group, "Update all" everything)
const whenAt=t=>{if(!t)return "never";const d=new Date(t),today=new Date().toDateString()===d.toDateString();
  return (today?"":d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+" ")+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
function loadBar(){const e=$("#loadbar");if(!e||DEMO&&!window.EL_LIVE_DEMO)return;const g=GR.find(x=>x.id===S.g),lv=liveOn()||window.EL_LIVE_DEMO;
  if(lv&&g){e.innerHTML=`<span class="live">🟢 <b>Live: ${esc(g.name)} is in class</b>. Its students' work updates by itself every 7 minutes (last: ${whenAt(AT.g[g.id])}${LIVE.err?", the last try failed, trying again":""}).</span> `
    +`<button class="mini" data-load="${g.id}" title="Fetch this group's whole work now, with the student list and levels">🔄 Update ${esc(g.name)}</button>`;return}
  e.innerHTML=`Students' work${g?` in <b>${esc(g.name)}</b>: as of ${whenAt(AT.g[g.id])}`:`: ${GR.map(x=>esc(x.name)+" "+whenAt(AT.g[x.id])).join(" · ")}`}. `
    +(g?`<button class="mini" data-load="${g.id}" title="Fetch this group's latest work (about a quarter of everything)">🔄 Update ${esc(g.name)}</button> `:"")
    +`<button class="g mini" data-load="all" title="Fetch every group's latest work (the most reads: use it rarely)">Update all</button>`}
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-load]");if(!b)return;const m=b.dataset.load;
  document.querySelectorAll("[data-load]").forEach(x=>x.disabled=true);b.textContent="⏳ Fetching…";
  try{S.D=await load(m);TOUCHED.clear();LIVE.since={};render()}catch(e){console.warn("load",e);alert("Could not fetch: "+e.message);loadBar()}});
if(DEMO)start("Preview with sample students: nothing is saved.");
else ELCloud.onUser(u=>{if(u&&ELCloud.isTeacher(u)){start("Hello, "+(u.displayName||u.email)+".");return}
  // Nobody signed in on this browser (Google's sign-in had ended, or a bookmark to the dashboard): the welcome page, where everyone signs in
  // (Roger, 7 Nov 2026: "this should be the page"). el-cloud.js has already removed el_who, so the welcome page does not send it back here.
  if(!u)location.replace("index.html")});
