<h1>Teacher dashboard</h1><p class="muted" id="msg">Sign in with your teacher account (button at the bottom right).</p>
<div id="app" hidden>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<div id="pdf"></div>
<script src="shared/js/el-catalog.js"></script>
<script src="shared/js/el-criteria.js"></script>
<script src="shared/js/el-plan.js"></script>
<script src="shared/js/el-week.js"></script>
<script src="shared/js/el-grading.js"></script>
<script src="shared/js/el-points.js"></script>
<script type="module">
// Demo mode: a page that defines window.EL_DEMO_DATA before this script gets sample data and no Firebase.
const DEMO=window.EL_DEMO_DATA;let F=null,db=null;
if(!DEMO){await import("./shared/js/el-cloud.js");F=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");db=()=>ELCloud.db}
const $=s=>document.querySelector(s),cat=EL_CATALOG,GR=EL_GROUPS,esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LV=Object.fromEntries(EL_LEVELS.map(l=>[l.id,l.name])),resKey=a=>a.replace("/","__");
const S={g:GR[0].id,route:"all",tutor:"all",ls:null,folded:new Set(),open:new Set(),D:null,P:{},zero:true,term:elTerm(),wk:null,tips:(()=>{try{return localStorage.getItem("el_t_tips")!=="off"}catch(e){return true}})()};   // P: people on screen (see people()); zero: missing work counts 0 in the LS grade; term: of the team points
const LS_INFO={hidden:["Hidden","Students cannot do anything in it."],open:["Open","Students practise and their progress is saved; graded activities only if you enable them."],closed:["Closed","Students can only review what they did and the feedback."],public:["Public","Free access as before: no login and no scoring."]};
const STCOL={hidden:"#64748b",open:"#16a34a",closed:"#b45309",public:"#2563eb"};

// ---- data: D = {st:{uid:{uid,name,email,group}}, rs:{uid:{activity:result}}, lv:{uid:{ls:{level,request}}}, pg:{uid:{ls:data}}, ls:{id:{status,enabled}}, ro:{id:{email,group,surname1,surname2,first,tutor}},
//               pt:{id:{team,t1,t2,t3}}, tm:{group:{list,score,best}}, tk:{group:{ticks:{"ls|session line":true}}} (the teacher's time plan checklist)}
// ro = student list (roster/{email in lower case}, or pending-… for a student without an email yet), imported here; it is never stored in the repository.
// pt, tm = team points (points/{same id as the list}, teams/{group}; shared/js/el-points.js).
async function load(){
  if(DEMO){DEMO.ro=DEMO.ro||{};DEMO.pt=DEMO.pt||{};DEMO.tm=DEMO.tm||{};DEMO.tk=DEMO.tk||{};return DEMO}
  const D={st:{},rs:{},lv:{},pg:{},ls:{},ro:{},pt:{},tm:{},tk:{}},up=r=>r.ref.parent.parent.id;
  try{(await F.getDocs(F.collection(db(),"roster"))).forEach(r=>D.ro[r.id]=r.data())}catch(e){D.roErr=true;console.warn("roster",e)}
  try{(await F.getDocs(F.collection(db(),"points"))).forEach(p=>D.pt[p.id]=p.data());(await F.getDocs(F.collection(db(),"teams"))).forEach(t=>D.tm[t.id]=t.data())}catch(e){D.ptErr=true;console.warn("points",e)}
  try{(await F.getDocs(F.collection(db(),"teacherPlan"))).forEach(t=>D.tk[t.id]=t.data())}catch(e){console.warn("teacherPlan",e)}
  (await F.getDocs(F.collection(db(),"students"))).forEach(s=>D.st[s.id]=Object.assign({uid:s.id},s.data()));
  (await F.getDocs(F.collectionGroup(db(),"results"))).forEach(r=>(D.rs[up(r)]=D.rs[up(r)]||{})[r.data().activity]=r.data());
  (await F.getDocs(F.collectionGroup(db(),"levels"))).forEach(l=>(D.lv[up(l)]=D.lv[up(l)]||{})[l.id]=l.data());
  (await F.getDocs(F.collectionGroup(db(),"progress"))).forEach(p=>(D.pg[up(p)]=D.pg[up(p)]||{})[p.id]=p.data().data||{});
  for(const l of EL_LS)D.ls[l.id]=await ELCloud.lsInfo(l.id);
  // students who only have results/progress (no profile yet) still appear, without a group
  Object.keys(Object.assign({},D.rs,D.pg,D.lv)).forEach(u=>D.st[u]=D.st[u]||{uid:u,name:"",email:u});
  return D;
}
const sub=o=>Object.assign(o,{updated:DEMO?Date.now():F.serverTimestamp()});
const put=(path,o)=>DEMO?null:F.setDoc(F.doc(db(),...path),sub(o),{merge:true});
const api={
  tick:(gid,ls,line,on)=>{const k=ls+"|"+line;((S.D.tk[gid]=S.D.tk[gid]||{}).ticks=S.D.tk[gid].ticks||{})[k]=on;return put(["teacherPlan",gid],{ticks:{[k]:on}})},
  setGroup:(u,g)=>{const s=S.P[u],ps=[];   // the list's group decides; the student's own doc copies it
    if(s.ro)ps.push(DEMO?S.D.ro[s.rid].group=g:put(["roster",s.rid],{group:g}));
    if(!s.away)ps.push(DEMO?S.D.st[u].group=g:put(["students",u],{group:g}));
    return Promise.all(ps)},
  saveRo:(id,o,old,uid)=>{const po=old&&old!==id&&S.D.pt[old];   // a new id (an email for a pending student) takes the team points along
    if(DEMO){if(old&&old!==id)delete S.D.ro[old];S.D.ro[id]=o;if(uid)S.D.st[uid].group=o.group;if(po){S.D.pt[id]=po;delete S.D.pt[old]}return}
    const ps=[put(["roster",id],o)];if(old&&old!==id)ps.push(F.deleteDoc(F.doc(db(),"roster",old)));if(uid)ps.push(put(["students",uid],{group:o.group}));
    if(po)ps.push(put(["points",id],Object.assign({},po)),F.deleteDoc(F.doc(db(),"points",old)));return Promise.all(ps)},
  delRo:id=>DEMO?delete S.D.ro[id]:F.deleteDoc(F.doc(db(),"roster",id)),
  importRoster:async out=>{const gone=Object.keys(S.D.ro).filter(id=>!out[id]);if(DEMO){S.D.ro=out;return}   // replaces the whole list
    const ops=[...Object.entries(out).map(([id,o])=>b=>b.set(F.doc(db(),"roster",id),sub(Object.assign({},o)))),...gone.map(id=>b=>b.delete(F.doc(db(),"roster",id)))];
    for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(db());ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}},
  // route: setting it (directly or by accepting a request) clears any request; declining keeps the route and tells the student (declined)
  setLevel:(u,ls,level)=>{if(DEMO){const l=((S.D.lv[u]=S.D.lv[u]||{})[ls]=S.D.lv[u][ls]||{});l.level=level;delete l.request;delete l.reason;delete l.declined;return}return put(["students",u,"levels",ls],{level,request:F.deleteField(),reason:F.deleteField(),declined:F.deleteField()})},
  reject:(u,ls)=>{const l=S.D.lv[u][ls],to=l.request;if(DEMO){delete l.request;delete l.reason;l.declined=to;return}return put(["students",u,"levels",ls],{request:F.deleteField(),reason:F.deleteField(),declined:to,declinedAt:F.serverTimestamp()})},
  result:(u,a,o)=>{o=Object.assign({ls:a.ls,activity:a.id},o);if(DEMO){const r=(S.D.rs[u]=S.D.rs[u]||{});r[a.id]=Object.assign(r[a.id]||{},o);return}return put(["students",u,"results",resKey(a.id)],o)},
  ls:(id,o)=>DEMO?Object.assign(S.D.ls[id],o):put(["ls",id],o),
  // answer to a final-product step: results/{activity}.replies[step]; the student sees it on their page
  reply:(u,a,step,text)=>{if(DEMO){const r=(S.D.rs[u]=S.D.rs[u]||{}),x=(r[a.id]=r[a.id]||{ls:a.ls,activity:a.id});(x.replies=x.replies||{})[step]=text;return}return put(["students",u,"results",resKey(a.id)],{ls:a.ls,activity:a.id,replies:{[step]:text}})}
};
async function act(p){try{await p}catch(e){console.warn(e);alert("Could not save: "+e.message)}if(!DEMO)S.D=await load();render()}
// One-click assessment (levels, groups, exam marks, confirmed degrees): merged into results/{id} at once and on screen without reloading.
// null deletes a field. id is an activity id, or the LS's own record (asId: exam marks, exam writing level, confirmed degrees).
const deep=(t,o)=>{for(const k in o){const v=o[k];if(v===null)delete t[k];else if(v&&typeof v==="object"&&!Array.isArray(v)){t[k]=t[k]&&typeof t[k]==="object"?t[k]:{};deep(t[k],v)}else t[k]=v}return t};
const fsv=o=>{const r={};for(const k in o){const v=o[k];r[k]=v===null?F.deleteField():v&&typeof v==="object"&&!Array.isArray(v)?fsv(v):v}return r};
function patch(u,id,o){o=Object.assign({ls:S.ls,activity:id},o);const r=(S.D.rs[u]=S.D.rs[u]||{});deep(r[id]=r[id]||{},o);return DEMO?Promise.resolve():put(["students",u,"results",resKey(id)],fsv(o))}
function quick(ps){Promise.all([].concat(ps)).catch(e=>{console.warn(e);alert("Could not save: "+e.message)});render();again()}

// ---- helpers
// The tester is not on the student list, so its Google name ("Roger Beltran Porres") would not follow "Surname1 Surname2, First"
const TESTER_NAME={surname1:"Beltran",surname2:"Porres",first:"Roger"};
const nameOf=s=>s.ro&&s.ro.surname1?s.ro:s.tester?TESTER_NAME:null;
const fullName=s=>{const n=nameOf(s);return n?[n.surname1,n.surname2].filter(Boolean).join(" ")+", "+n.first:s.name||s.email||s.uid};
const name=s=>esc(fullName(s));
const norm=x=>String(x??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const listed=()=>Object.keys(S.D.ro).length>0,isTester=s=>!DEMO&&ELCloud.isTester(s);
// Everyone on the student list (s.ro; s.away until they first sign in) and everyone who signed in. With a list, its group decides:
// signed-in students who are not on it (except testers) have no group and cannot sign in any more.
function people(){
  const D=S.D,P={},seen=new Set();
  Object.values(D.st).forEach(s=>{const e=(s.email||"").toLowerCase(),ro=D.ro[e];if(ro)seen.add(e);
    P[s.uid]=Object.assign({},s,{ro,rid:ro?e:null,tester:isTester(s),group:ro?ro.group:listed()&&!isTester(s)?null:s.group})});
  Object.entries(D.ro).forEach(([id,ro])=>{if(!seen.has(id))P["ro:"+id]={uid:"ro:"+id,rid:id,email:ro.email||"",ro,group:ro.group,away:true}});
  return P;
}
// Folded sections remember whether they are open across re-renders
const fold=(k,title,html,cls="",force)=>`<details data-k="${k}" class="${cls}" ${S.open.has(k)||force?"open":""}><summary>${title}</summary>${html}</details>`;
let COURSE=null;   // course of the group on screen: criteria texts depend on it
const pill=c=>`<span class="pill ce${c[0]}" data-do="crit" data-c="${c}" tabindex="0" title="${esc(elCompetence(c)+" · "+c+": "+(elCriterion(COURSE,c)||"–"))}">${c}</span>`;
const route=l=>l?`<span class="route r-${l}">${LV[l]||l}</span>`:'<span class="route r-none">–</span>';
const level=(u,ls)=>((S.D.lv[u]||{})[ls]||{}).level;
const acts=ls=>cat.filter(a=>a.ls===ls);
const steps=a=>EL_ACTIONS[a.id]||[];
const doneSet=(u,a)=>{const p=(S.D.pg[u]||{})[a.ls]||{},s=new Set();a.keys.forEach(k=>elDoneSet(p[k]).forEach(x=>s.add(x)));return s};
const stepCrit=(a,k)=>(a.skip||[]).includes(k)?'<small class="muted">not scored</small>':((((window.EL_STEP_CRITERIA||{})[a.id]||{})[k]||EL_EVIDENCE[k]||[]).map(pill).join("")||'<small class="muted" title="Language practice: no criterion linked">–</small>');

    +(steps(a).length?`<table><thead><tr><th style="text-align:left">Activity</th><th>Criterion</th><th>Done</th>${gx?"<th>First try</th><th>Latest</th><th>On time</th>":""}</tr></thead><tbody>${steps(a).map(k=>{const f=gx&&firstOf(u,id,k),t=gx&&onTime(u,id,k,s.group),dd=gx&&doneAt(u,id,k);return `<tr><td style="text-align:left">${k}</td><td>${stepCrit(a,k)}</td><td>${d.has(k)?"✔":"–"}</td>${gx?`<td>${f?f.score+"/"+f.max:"–"}</td><td>${(l=>l?trySc(l):"–")(lastOf(u,id,k))}</td><td title="${esc((dd&&dd!==true?"done "+ymd(dd):"")+(dueOf(id,s.group)?" · due "+dueOf(id,s.group):""))}">${t===1?"✔":t===0?"late":"–"}</td>`:""}</tr>`}).join("")}</tbody></table>`:"")
    +(a.steps?handIns(u,a):"")
    +levelRows(u,a)
    +(a.manual?`<label>Mark</label><input id="fsc" type="number" step="0.5" style="width:80px" value="${x.score??""}"> out of <input id="fmx" type="number" style="width:80px" value="${x.max??10}">`:"")
    +`<label>Feedback for the student</label><textarea id="ffb">${esc(x.feedback||"")}</textarea>`
    +`<div class="row">${x.locked?`<button class="g" data-do="reopen" data-u="${u}" data-a="${id}" title="The student keeps their progress and has to mark it as done again">Allow resubmission</button>`:""}<button data-do="save" data-u="${u}" data-a="${id}">Save</button></div>`);
}

// ---- marking PDF per round (EL_GRADING[ls].marking; root AGENTS.md "Teacher dashboard"): a print view with every student's answers for one
// round of the final product and the rubric rows of that round (round, group, video in the LS's rubric data), as each route sees them. Saves nothing.
const RUB={};   // rubric data per file, loaded the first time it is needed (a preview may define window.finalRubricData already)
const loadRubric=p=>RUB[p]?Promise.resolve(RUB[p]):DEMO&&window.finalRubricData?Promise.resolve(RUB[p]=window.finalRubricData)
  :new Promise((ok,ko)=>{const s=document.createElement("script");s.src=p;s.onload=()=>ok(RUB[p]=window.finalRubricData);s.onerror=()=>ko(new Error("the rubric did not load"));document.head.append(s)});
const day=d=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const LVN=[["Level 4","Very good"],["Level 3","Good"],["Level 2","Fair"],["Level 1","Developing"]];
const peerLevel=v=>v>=3.5?"Level 4":v>=2.5?"Level 3":v>=1.5?"Level 2":"Level 1";
// Teammates' names are typed by students: a rating goes to the only member whose first name or full name it matches (case and accents ignored)
function whoIs(typed,ms){const t=norm(typed);if(!t)return null;
  const first=s=>{const n=nameOf(s);return n?n.first||"":(s.name||"").split(" ")[0]};
  const keys=s=>{const n=nameOf(s);return n?[n.first,n.first+n.surname1,n.first+n.surname1+n.surname2,n.surname1+n.surname2+n.first].map(norm):[norm(s.name)]};
  const one=f=>{const c=ms.filter(f);return c.length===1?c[0]:null};
  return one(s=>keys(s).includes(t))||one(s=>norm(first(s).split(" ")[0])===t)||one(s=>{const f=norm(first(s).split(" ")[0]);return !!f&&t.startsWith(f)})}
// Ratings each member received from the others in their hand-in of `step`; ratings that match no member are listed on the group page
function peerRatings(ms,a,step){const got={},odd=[];
  ms.forEach(m=>((handedIn(m.uid,a)[step]||{}).peers||[]).forEach(p=>{const vs=(p.r||[]).map(x=>+x.v).filter(v=>v>0);if(!vs.length)return;
    const v=vs.reduce((x,y)=>x+y,0)/vs.length,to=whoIs(p.name,ms.filter(x=>x.uid!==m.uid));to?(got[to.uid]=got[to.uid]||[]).push(v):odd.push({name:p.name,by:m,v})}));
  return {got,odd}}
// Steps 0–5: handed in, on time (by the final product's due date; afterDue steps come after submitting) and self-assessment
function procRows(s,fp){const m=G().marking,h=handedIn(s.uid,fp),due=dueOf(fp.id,S.g);
  return m.process.map(k=>{const x=h[k],after=(m.afterDue||[]).includes(k);return {k,x,after,t:(fp.steps.find(y=>y[0]===k)||[])[1]||k,ok:x&&due&&!after?ymd(x.date)<=due:null}})}
function procTable(s,fp){const due=dueOf(fp.id,S.g);
  return `<div class="ans"><h4>Process summary <small class="muted">(steps 0–5${due?" · due "+day(due):""})</small></h4><table><thead><tr><th>Step</th><th>Handed in</th><th>On time</th><th>Self-assessment</th></tr></thead><tbody>`
    +procRows(s,fp).map(p=>`<tr><td>${esc(p.t)}</td><td>${p.x?"✓ "+day(p.x.date):"–"}</td><td>${p.ok==null?p.x&&p.after?"after submitting":"–":p.ok?"✓":"late"}</td><td>${p.x&&p.x.avg!=null?p.x.avg+"/4":"–"}</td></tr>`).join("")+`</tbody></table></div>`}
const procLine=(s,fp)=>{const ps=procRows(s,fp),n=ps.filter(p=>p.x).length,late=ps.filter(p=>p.ok===false).length;return `Handed in ${n}/${ps.length}${late?` · ${late} late`:""} (process summary above)`};
// One hand-in: every field with its line breaks, the self-assessment average (o.rate: also the self-check) and the student's comment
function answer(s,a,k,o,fp){const x=handedIn(s.uid,a)[k],t=(a.steps.find(y=>y[0]===k)||[])[1]||k,title=a.id===fp.id?"Step "+t:a.title+" · "+t;
  if(!x)return `<div class="ans"><h4>${esc(title)}</h4><p class="muted">Not handed in yet.</p></div>`;
  return `<div class="ans"><h4>${esc(title)} <small class="muted">· handed in ${day(x.date)}${x.avg!=null?" · self-assessment "+x.avg+"/4":""}</small></h4>`
    +(x.f||[]).map(f=>`<p><b>${esc(f.l)}</b><br><span class="v">${f.v?esc(f.v):'<span class="muted">(empty)</span>'}</span></p>`).join("")
    +(o.rate&&(x.rate||[]).length?`<p><b>Self-check</b></p><ul class="rate">${x.rate.map(q=>`<li>${q.v}/4 · ${esc(q.s)}</li>`).join("")}</ul>`:"")
    +(x.comment?`<p><b>Comment to you:</b> ${esc(x.comment)}</p>`:"")+`</div>`}
// Rubric rows quoted from the route's rubric (Insecure in Catalan), four tick boxes per row. items: [row, who, note]
const rubricTable=items=>items.length?`<table class="rb"><thead><tr><th>Criterion</th>${LVN.map(([a,b])=>`<th>${a} · ${b}</th>`).join("")}</tr></thead><tbody>`
  +items.map(([w,who,note])=>`<tr><td class="rn"><b>${w.name}</b>${who?`<br><b>${who}</b>`:""}<br><small>${w.sub||""}</small><br><span class="tag">${typeof w.pct==="number"?w.pct+" %":esc(w.pct||"")}</span>${w.group?' <span class="tag">Group</span>':""}${note?`<div class="note">${note}</div>`:""}</td>${w.cells.map(c=>`<td><span class="tick">☐</span> ${c}</td>`).join("")}</tr>`).join("")+`</tbody></table>`:"";
function pdfAsk(){redraw=null;
  dlg(`<h3>📄 Marking PDF · ${esc(GR.find(g=>g.id===S.g).name)}</h3><p class="muted">Every student's answers for one round of the final product, with the rubric rows of that round as each group's route sees them. It opens a print view: save it as a PDF or print it. Nothing is saved, and the answers stay in this browser.</p><div class="opts">`
    +Object.entries(G().marking.rounds).map(([r,x])=>`<button class="opt" data-do="pdf" data-r="${r}"><b>${esc(x.name)}</b><small>${esc(x.note||"")}</small></button>`).join("")+`</div>`)}
// One section per final product group (results/{fp}.team; students without a group last): the group page, then one page per student
function pdfGroup(t,ms,r,R,data,fp,top){
  const cnt={};ms.forEach(s=>{const l=level(s.uid,S.ls);if(l)cnt[l]=(cnt[l]||0)+1});
  const gr=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||null,rub=l=>data[l]||(l==="beginners"?data.insecure:null)||data.safe;   // same-route groups: the route most members have
  const pr=R.peers&&t?peerRatings(ms,fp,R.peers):null;let h="";
  if(t){const rows=rub(gr).rows,gw=rows.filter(w=>w.round==r&&w.group),vw=rows.filter(w=>w.round==r&&w.video&&!w.group);
    if(gw.length||vw.length)h+=`<section class="pg"><p class="top">${top}</p><h2>Group: ${esc(t)} ${route(gr)}</h2><p>${ms.map(s=>name(s)+(Object.keys(cnt).length>1?" "+route(level(s.uid,S.ls)):"")).join(" · ")}</p>`
      +`<h3>${vw.length?'Video sheet <small class="muted">(rubric only: watch the video on Classroom)</small>':"Group rows"}</h3>`+rubricTable([...ms.flatMap(s=>vw.map(w=>[w,name(s)])),...gw.map(w=>[w])])
      +(pr&&pr.odd.length?`<h3>Teammates' ratings that match no member</h3><ul>${pr.odd.map(o=>`<li>“${esc(o.name)}”, rated by ${name(o.by)}: ${f1(o.v)}</li>`).join("")}</ul>`:"")+`</section>`}
  ms.forEach(s=>{const own=level(s.uid,S.ls),l=own||gr,got=pr?pr.got[s.uid]||[]:[],pv=got.length?got.reduce((a,b)=>a+b,0)/got.length:null;
    const note=w=>w.peers?(!t?"No final product group: teammates' ratings cannot be matched.":pv==null?"No teammates' ratings received yet.":`Teammates' average: <b>${f1(pv)}</b> (${got.length} rating${got.length>1?"s":""}) → <b>${peerLevel(pv)}</b>`):w.process&&R.process?procLine(s,fp):"";
    h+=`<section class="pg"><p class="top">${top}</p><h2>${name(s)}</h2><p class="muted">${t?"Group: "+esc(t):"No final product group"} · ${route(own)}${own?"":" (route not chosen: "+(LV[l]||"Safe")+" rubric)"}</p>`
      +R.answers.map(([id,k,o])=>answer(s,byId(id),k,o||{},fp)).join("")+(R.process?procTable(s,fp):"")
      +`<h3>Rubric</h3>`+rubricTable(rub(l).rows.filter(w=>w.round==r&&!w.group&&!w.video).map(w=>[w,"",note(w)]))
      +`<div class="cmt"><b>Comment</b><div class="line"></div><div class="line"></div></div></section>`});
  return h}
async function markingPdf(r){
  const g=G(),R=g.marking.rounds[r],fp=byId(g.fp.a),grp=GR.find(x=>x.id===S.g);let data;
  try{data=await loadRubric(g.marking.rubric)}catch(e){alert("Could not open the marking PDF: "+e.message);return}
  const all=Object.values(S.P).filter(s=>s.group===S.g||s.tester),away=all.filter(s=>s.away);
  const has=s=>teamOf(s.uid,fp.id)||R.answers.some(([id,k])=>handedIn(s.uid,byId(id))[k]);   // the tester only with something to mark
  const studs=all.filter(s=>!s.away&&(!s.tester||has(s))).sort(byName),teams=[...new Set(studs.map(s=>teamOf(s.uid,fp.id)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ca"));
  const top=`${esc(grp.name)} · ${esc((EL_LS.find(l=>l.id===S.ls)||{}).title)} · ${esc(fp.title)} · <b>${esc(R.name)}</b>`;
  const pages=[...teams.map(t=>[t,studs.filter(s=>teamOf(s.uid,fp.id)===t)]),["",studs.filter(s=>!teamOf(s.uid,fp.id))]].filter(([,ms])=>ms.length).map(([t,ms])=>pdfGroup(t,ms,r,R,data,fp,top)).join("");
  $("#pdf").innerHTML=`<div class="pdfbar"><button data-do="pdfprint">🖨️ Print / save as PDF</button><button class="g" data-do="pdfback">← Back to the dashboard</button><span class="muted">${teams.length} group${teams.length===1?"":"s"} · ${studs.length} student${studs.length===1?"":"s"}${away.length?` · not included (not signed in yet): ${away.map(name).join(" · ")}`:""}. In the print dialog choose A4 and “Save as PDF”.</span></div>`
    +(pages||`<section class="pg"><p>No signed-in students in ${esc(grp.name)} yet.</p></section>`);
  document.body.classList.add("pdfmode");scrollTo(0,0);setTimeout(()=>print(),300)}

// ---- events
document.addEventListener("click",e=>{const t=e.target.closest("[data-do]");if(!t||t.tagName==="SELECT")return;const k=t.dataset,u=k.u,a=k.a&&cat.find(x=>x.id===k.a);
  ({tab:()=>{S.g=k.g;S.tutor="all";if(k.ls)S.ls=k.ls;render();if(k.ls)scrollTo(0,0)},route:()=>{S.route=k.r;render()},tutor:()=>{S.tutor=k.t;render()},reload:()=>act(),
    tick:()=>quick(api.tick(k.gid,k.ls,k.line,t.checked)),wk:()=>{S.wk=k.w;S.g="plan";render()},
    tips:()=>{S.tips=!S.tips;try{localStorage.setItem("el_t_tips",S.tips?"on":"off")}catch(e){}render()},
    addstu:()=>dlg("<h3>Add a student</h3>"+roForm({})),impok:()=>{$("#dlg").close();act(api.importRoster(S.imp))},
    rosave:()=>{const v=f=>$("#ro-"+f).value.replace(/\s+/g," ").trim(),o={email:v("email").toLowerCase(),surname1:v("surname1"),surname2:v("surname2"),first:v("first"),tutor:v("tutor"),group:$("#ro-group").value};
      if(o.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email))return alert("Check the email.");
      if(!o.email&&!o.surname1&&!o.first)return;
      const s=u?S.P[u]:null,old=s&&s.ro?s.rid:null,id=o.email||(old&&old.startsWith("pending-")?old:"pending-"+norm(o.surname1+o.surname2+o.first));
      if(S.D.ro[id]&&id!==old)return alert("This student is already on the list.");
      $("#dlg").close();act(api.saveRo(id,o,old,s&&!s.away?s.uid:null))},
    rodel:()=>{const s=S.P[u];if(!confirm("Remove "+fullName(s)+" from the student list? They will not be able to sign in. Their work is kept."))return;$("#dlg").close();act(api.delRo(s.rid))},
    fold:()=>{S.folded.has(k.a)?S.folded.delete(k.a):S.folded.add(k.a);render()},unfold:()=>{S.folded.clear();render()},"fold-all":()=>{acts(S.ls).forEach(x=>S.folded.add(x.id));render()},
    acc:()=>{$("#dlg").close();act(api.setLevel(u,S.ls,k.to))},rej:()=>{$("#dlg").close();act(api.reject(u,S.ls))},
    rt:()=>rtPanel(u),setrt:()=>{$("#dlg").close();act(api.setLevel(u,S.ls,k.r))},
    crit:()=>critPanel(k.c),stu:()=>stuPanel(u),cell:()=>cellPanel(u,k.a),close:()=>$("#dlg").close(),
    pdfask:()=>pdfAsk(),pdf:()=>{$("#dlg").close();markingPdf(k.r)},pdfprint:()=>print(),pdfback:()=>{document.body.classList.remove("pdfmode");$("#pdf").innerHTML=""},
    // assessment: one click saves and redraws
    grade:()=>gradePanel(u),deg:()=>degPanel(u,k.c),zero:()=>{S.zero=k.z==="1";render();again()},
    lv:()=>{const cur=((res(u,k.a).levels||{})[k.s]||{})[k.c];quick(patch(u,k.a,{levels:{[k.s]:{[k.c]:cur===k.l?null:k.l}}}))},
    glv:()=>{const cur=((res(u,k.a).levels||{}).group||{})[k.c],v=cur===k.l?null:k.l,ms=teamMates(k.a,teamOf(u,k.a),S.P[u].group);if(!ms.some(m=>m.uid===u))ms.push(S.P[u]);
      quick(ms.map(m=>patch(m.uid,k.a,{levels:{group:{[k.c]:v}}})))},
    down:()=>quick(patch(u,k.a,{down:{[k.c]:t.checked?true:null}})),
    team:()=>{const v=$("#team").value.replace(/\s+/g," ").trim();if(v===teamOf(u,k.a))return;
      const mate=teamMates(k.a,v,S.P[u].group).find(m=>m.uid!==u&&(res(m.uid,k.a).levels||{}).group);   // a new member gets the group's levels
      quick(patch(u,k.a,{team:v||null,levels:{group:mate?Object.assign({},res(mate.uid,k.a).levels.group):null}}))},
    fin:()=>{const id=asId(S.ls),cur=(res(u,id).final||{})[k.c];quick(patch(u,id,{final:{[k.c]:cur===k.l?null:k.l}}))},
    examsave:()=>quick(saveExam($("#main"))),examsave1:()=>quick(saveExam($("#dlgc"))),
    replysave:()=>{const v=$("#rp-"+k.s).value.trim();if(!v)return;act(api.reply(u,a,k.s,v)).then(()=>cellPanel(u,a.id))},
    save:()=>{const o={feedback:$("#ffb").value};if(a.manual){const sc=$("#fsc").value,mx=$("#fmx").value;if(sc!==""&&mx!==""&&!isNaN(+sc)&&!isNaN(+mx)){o.score=+sc;o.max=+mx}}$("#dlg").close();act(api.result(u,a,o))},
    reopen:()=>{if(!confirm("Allow the student to redo and resubmit this activity? Their progress is kept; they will have to mark it as done again."))return;$("#dlg").close();act(api.result(u,a,{locked:false,markedDone:false,reopenedAt:DEMO?Date.now():F.serverTimestamp()}))},
    status:()=>{if(k.s==="closed"&&!confirm("Close the LS: students will no longer be able to change anything. Continue?"))return;act(api.ls(S.ls,{status:k.s}))},
    assign:()=>{const l=EL_LS.find(x=>x.id===S.ls),info=S.D.ls[S.ls],set=new Set(lsGroups(S.ls).filter(g=>elLsForGroup(l,info,g.id)).map(g=>g.id));set.has(k.g)?set.delete(k.g):set.add(k.g);act(api.ls(S.ls,{groups:[...set]}))},
    ptterm:()=>{S.term=k.t;render()},ptadd:()=>quick(pt.add(k.k,S.g,+k.d)),
    ptnew:()=>{const list=[...((S.D.tm[S.g]||{}).list||[])],n=Math.max(0,...list.map(x=>+x.id.split("-").pop()||0))+1;list.push({id:S.g+"-"+n,name:"Team "+n});quick(pt.list(S.g,list))},
    ptdel:()=>{const list=(S.D.tm[S.g]||{}).list||[],x=list.find(y=>y.id===k.id),ms=ptStuds(S.g).filter(s=>ptOf(s).team===k.id);
      if(!x||!confirm(`Remove ${x.name}?`+(ms.length?` Its ${ms.length} student${ms.length===1?"":"s"} will have no team; their points stay.`:"")))return;
      quick([pt.list(S.g,list.filter(y=>y.id!==k.id)),...ms.map(s=>pt.team(pkey(s),""))])},
    enable:()=>{const set=new Set(S.D.ls[S.ls].enabled);set.has(k.a)?set.delete(k.a):set.add(k.a);act(api.ls(S.ls,{enabled:[...set]}))}
  })[k.do]?.()});
$("#dlg").addEventListener("close",()=>redraw=null);
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)e.target.open?S.open.add(k):S.open.delete(k)},true);

  if(k.do==="import"&&t.files[0])importList(t.files[0]).catch(x=>alert("Could not read the file: "+x.message)).finally(()=>t.value="");
