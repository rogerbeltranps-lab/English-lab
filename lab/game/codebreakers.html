<!doctype html>
<html lang="en" class="notranslate" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><script src="../../shared/js/el-nocopy.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06141f">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../favicon-192.png">
<title>Code Breakers · English Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="cb.css">
<style>
/* 🕵️ Code Breakers board (projector), the same sizes as the class game board (host.html) */
body{font-size:clamp(16px,1.15vw + 6px,30px)}
.top{display:flex;align-items:center;gap:.6em;padding:.5em 1em;font-weight:600}
.top .sp{flex:1}
.top .pill{background:rgba(0,0,0,.25);border-radius:999px;padding:.2em .8em;white-space:nowrap}
.top .btn{padding:.3em .8em}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8em;padding:0 1.2em 1.2em}
.center{flex:1;display:grid;place-items:center;text-align:center;padding:1em}
h1.logo{font-size:3em;margin:.1em 0;letter-spacing:.01em;text-shadow:0 .08em 0 rgba(0,0,0,.25)}
.sub{opacity:.9;margin:.2em 0 1em}
.picks{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center}
.deckbtn{display:flex;align-items:center;gap:.5em;font-size:1.1em;padding:.7em 1.2em}
.deckbtn .e{font-size:1.6em}
.courses{width:min(94vw,64em);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24em),1fr));gap:1.2em;align-items:start;margin-bottom:1em}
.course{background:rgba(0,0,0,.18);border-radius:18px;padding:.6em 1em 1em}
.course h2{margin:.1em 0 .2em;font-size:1.7em}
.course h3{margin:.6em 0 .5em;font-size:1.1em;opacity:.9;font-weight:600}
.course .picks{flex-direction:column;align-items:stretch}
.course .deckbtn{text-align:left}
.join{display:flex;align-items:center;justify-content:center;gap:1em;flex-wrap:wrap}
.join .card{padding:.5em 1.2em;font-size:1.1em}
.count{font-size:1.4em;font-weight:700}
.names{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;align-content:flex-start;max-height:38vh;overflow:hidden;padding:.6em}
.names span{background:#fff;color:var(--ink);border-radius:10px;padding:.25em .7em;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.top .btn.on{background:#fff;color:var(--ink)}
.top{position:relative}.top button.pill{border:0;color:#fff;font:inherit;cursor:pointer}.top .pill.warn{background:#c2410c}.top .pill.warn.off{background:#b3261e}
.top .pill{font-variant-numeric:tabular-nums}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1em;height:46vh;margin-top:1em}
.podium div{height:100%;width:11em;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.podium .nm{font-weight:700;font-size:1.2em;margin-bottom:.3em;text-align:center}
.podium .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:.3em;font-size:2.4em;font-weight:700;color:var(--ink);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.podium .p1 .blk{background:var(--gold);height:70%}.podium .p2 .blk{background:#e6e9f2;height:50%}.podium .p3 .blk{background:#f0a868;height:36%}
.podium .sc{font-size:.9em;opacity:.9}
.msg{max-width:32em;padding:1.2em 1.6em}
.msg h2{margin:.1em 0 .4em;color:#5b21b6}
.kbd{opacity:.7;font-size:.75em;margin-left:.4em}
.muted{opacity:.7}
</style></head>
<body class="board cb"><div class="app" id="app"><div class="center"><p>Loading…</p></div></div>
<script src="../../shared/js/el-catalog.js"></script>
<script src="../../shared/js/el-points.js"></script>
<script src="game.js"></script>
<script src="decks/index.js"></script>
<script src="cb.js"></script>
<script src="cb-av.js"></script>
<script type="module" src="cb-host.js"></script>
</body></html>
