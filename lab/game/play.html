<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d1d8f">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../favicon-192.png">
<title>Class game · English Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="game.css">
<style>
/* The player: a student's Chromebook (about 1366×768, touch) or a phone. */
.top{display:flex;align-items:center;gap:.6em;padding:.6em 1em;font-weight:600;min-height:3.2em}
.top .sp{flex:1}.top .pill{flex:0 0 auto;background:rgba(0,0,0,.25);border-radius:999px;padding:.2em .8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}.top .pill:first-child{flex:0 1 auto;min-width:0}
.top .btn{padding:.3em .8em}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:0 16px 16px}
.center{flex:1;display:grid;place-items:center;text-align:center;padding:1em}
.big{font-size:clamp(28px,5vw,56px);font-weight:700;margin:.1em 0;text-shadow:0 .06em 0 rgba(0,0,0,.25)}
.mid{font-size:clamp(18px,2.4vw,28px);margin:.3em 0;opacity:.95}
.emo{font-size:clamp(64px,12vw,140px);line-height:1;margin:.1em 0}
.qcard{padding:.6em 1em;text-align:center;font-size:clamp(20px,2.6vw,34px);font-weight:700;line-height:1.25}
.play .tiles{flex:1;min-height:0;font-size:clamp(20px,2.4vw,34px)}
.play .tile{min-height:72px}
.play .tile:active{transform:scale(.97)}
.play .tiles.two{grid-template-columns:1fr 1fr}
.res{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:1em}
.res.ok{background:var(--ok)}.res.no{background:var(--no)}.res.none{background:#5b3aa6}
.res .mark{font-size:clamp(90px,16vw,180px);line-height:1}
.chosen{display:inline-flex;align-items:center;gap:.5em;font-size:clamp(22px,3vw,40px);padding:.5em 1em;border-radius:16px;color:#fff;font-weight:700;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22)}
.dots span{display:inline-block;width:.5em;height:.5em;margin:0 .15em;border-radius:50%;background:#fff;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.card.msg{max-width:30em;padding:1.2em 1.6em}.card.msg h2{margin:.1em 0 .4em;color:#5b21b6}
.note{font-size:14px;opacity:.85}
.center .btn.go{font-size:clamp(20px,2.2vw,28px);padding:.5em 1.6em}
</style></head>
<body class="play"><div class="app" id="app"><div class="center"><p>Loading…</p></div></div>
<script src="game.js"></script>
<script type="module" src="play.js"></script>
</body></html>
