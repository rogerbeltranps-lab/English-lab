<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d1d8f">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../favicon-192.png">
<title>Class game · English Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="game.css">
<style>
/* The board (projector): sized by the screen, so it fills a projected 16:9 picture. */
body{font-size:clamp(16px,1.15vw + 6px,30px)}
.top{display:flex;align-items:center;gap:.6em;padding:.5em 1em;font-weight:600}
.top .sp{flex:1}
.top .pill{background:rgba(0,0,0,.25);border-radius:999px;padding:.2em .8em;white-space:nowrap}
.top .btn{padding:.3em .8em}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8em;padding:0 1.2em 1.2em}
.center{flex:1;display:grid;place-items:center;text-align:center;padding:1em}
h1.logo{font-size:3em;margin:.1em 0;letter-spacing:.01em;text-shadow:0 .08em 0 rgba(0,0,0,.25)}
.sub{opacity:.9;margin:.2em 0 1em}
.picks{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center}
.deckbtn{display:flex;align-items:center;gap:.5em;font-size:1.1em;padding:.7em 1.2em}
.deckbtn .e{font-size:1.6em}
.join{display:flex;align-items:center;justify-content:center;gap:1em;flex-wrap:wrap}
.join .card{padding:.5em 1.2em;font-size:1.1em}
.count{font-size:1.4em;font-weight:700}
.names{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;align-content:flex-start;max-height:38vh;overflow:hidden;padding:.6em}
.names span{background:#fff;color:var(--ink);border-radius:10px;padding:.25em .7em;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.qcard{padding:.5em 1em;text-align:center;font-size:1.9em;font-weight:700;line-height:1.2}
.mid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 2.2fr 1fr;align-items:center;gap:1em}
.mid .pic{height:100%;max-height:34vh;font-size:min(12em,26vh)}
.stat{text-align:center}.stat b{display:block;font-size:3em;line-height:1}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:.8em;height:100%;max-height:30vh}
.bar{width:3.6em;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;border-radius:8px 8px 0 0;min-height:6px;transition:height .6s cubic-bezier(.2,1.2,.4,1)}
.bar span{display:flex;align-items:center;gap:.3em;font-weight:700;margin-top:.2em}
.why{padding:.4em 1em;font-size:1.25em;text-align:center}
.board .tiles{font-size:1.35em}
.board .tile{min-height:2.6em;cursor:default}
.theory{flex:1;display:grid;grid-template-columns:auto 1fr;gap:1.2em;align-items:center;padding:1em 1.6em;align-self:center;max-width:62em;width:100%}
.theory .pic{font-size:7em}
.theory h2{margin:0 0 .4em;font-size:1.9em;color:#5b21b6}
.theory p{margin:.45em 0;font-size:1.25em}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1em;height:46vh;margin-top:1em}
.podium div{height:100%;width:11em;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.podium .nm{font-weight:700;font-size:1.2em;margin-bottom:.3em;text-align:center}
.podium .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:.3em;font-size:2.4em;font-weight:700;color:var(--ink);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.podium .p1 .blk{background:var(--gold);height:70%}.podium .p2 .blk{background:#e6e9f2;height:50%}.podium .p3 .blk{background:#f0a868;height:36%}
.podium .sc{font-size:.9em;opacity:.9}
.msg{max-width:32em;padding:1.2em 1.6em}
.msg h2{margin:.1em 0 .4em;color:#5b21b6}
.kbd{opacity:.7;font-size:.75em;margin-left:.4em}
/* a written question: the prompt while students type, then the answer and the wrong answers (no names) */
.wask,.wans{display:flex;align-items:center;justify-content:center;gap:.6em;min-height:2.6em;padding:.4em 1em;border-radius:14px;font-size:1.6em;font-weight:700;text-align:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22)}
.wask{background:var(--c1)}
.wans{background:var(--ok);font-size:2em}.wans .mark{font-size:1.2em}.wans small{display:block;font-size:.5em;font-weight:600;opacity:.9}
.wrongs{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;align-items:center;font-size:1.15em}
.wrongs .w{background:rgba(255,255,255,.92);color:var(--no);border-radius:10px;padding:.2em .7em;font-weight:700}
.wrongs .w b{color:var(--ink)}
</style></head>
<body class="board"><div class="app" id="app"><div class="center"><p>Loading…</p></div></div>
<script src="../../shared/js/el-catalog.js"></script>
<script src="../../shared/js/el-points.js"></script>
<script src="game.js"></script>
<script src="decks/index.js"></script>
<script type="module" src="host.js"></script>
</body></html>
