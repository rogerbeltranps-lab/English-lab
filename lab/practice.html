<!-- the app menu at once, not after Firebase has loaded: the page opens on its real look (Roger, 7 Nov 2026) -->
<script src="../shared/js/el-app.js"></script>
<script type="module">
/* Self-practice by level (Roger, 31 Oct 2026, thread "Build a self-practice area by level"): the word cards, sentence builder,
   listenings and shadowing of the student's LSs, organised by level (the route with its CEFR label, EL_CEFR in el-catalog.js) and
   with the student's own level recommended. Nothing new: the page reads the LS content itself (LS2-style pages: <ls>/data/<page>.js,
   Pro panels from data/native/; LS1 pages: the vocabMap / ca / examples / levelInfo / listening objects in the page), so a new LS
   appears here on its own. Only the LSs and Learning Paths the student can open (status, group, paths opened by the teacher).
   Everything corrects itself and nothing is handed in: progress stays in this browser (el_ key, never synced). */
const DEMO = window.EL_DEMO_STUDENT;   // preview: {group, levels:{ls:{level}}, ls:{id:info}, teacher}
let F = null;
if (!DEMO) { await import('../shared/js/el-cloud.js'); F = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js'); }
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ROOT = '../';
const ROUTES = ['beginners', 'insecure', 'safe', 'daring'];
const KEY = 'el_practice';   // el_ keys stay in this browser
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) { return {} } })();
const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(store)) } catch (e) {} };
store.known = store.known || {}; store.listen = store.listen || {}; store.shadow = store.shadow || {}; store.gram = store.gram || {}; store.write = store.write || {};

/* ---------- routes, as in the LS2 engine: cumulative r: tags, Starter falls back to Base, Pro to Plus ---------- */
const base = lv => lv === 'native' ? 'daring' : lv;
const inR = (x, lv) => ROUTES.indexOf(x.r || 'beginners') <= ROUTES.indexOf(base(lv)) && (!x.only || x.only.includes(base(lv)));
const forLevel = (items, lv) => !items ? [] : Array.isArray(items) ? items.filter(x => inR(x, lv))
  : (items[lv] || items[base(lv)] || (base(lv) === 'beginners' ? items.insecure : null) || []);
const byLevel = (o, lv) => o == null ? '' : typeof o === 'string' ? o
  : o.ca != null || o.en != null ? (elCa(base(lv)) ? (o.ca || o.en) : (o.en || o.ca))
  : (o[lv] ?? o[base(lv)] ?? (base(lv) === 'daring' ? o.safe : null) ?? o.insecure ?? '');
const tx = o => o == null ? '' : typeof o === 'string' ? o : (o.en || o.ca || '');
// a route's own value, with no borrowing from the routes above it (a writing frame or a model is only for the routes that have one)
const strict = (o, lv) => o == null ? '' : typeof o !== 'object' || Array.isArray(o) ? o
  : o.ca != null || o.en != null ? byLevel(o, lv) : (o[lv] ?? o[base(lv)] ?? (base(lv) === 'beginners' ? o.insecure : null) ?? '');
const ls1Level = lv => lv === 'beginners' ? 'insecure' : base(lv);

/* ---------- reading the LS content ---------- */
const loadScript = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = () => { s.remove(); res(true) }; s.onerror = () => { s.remove(); res(false) }; document.head.append(s) });
let queue = Promise.resolve();   // the data files all set window.LP: one at a time
const serial = f => (queue = queue.then(f, f));
// one object literal from a page's script: const name={…} / [...] (quote-aware bracket matching)
function grab(html, name) {
  const i = html.search(new RegExp('\\bconst ' + name + '\\s*=\\s*[\\[{]')); if (i < 0) return null;
  const j = html.indexOf(html.slice(i).match(/[\[{]/)[0], i), open = html[j], close = open === '{' ? '}' : ']';
  let d = 0, q = null;
  for (let k = j; k < html.length; k++) {
    const c = html[k];
    if (q) { if (c === '\\') k++; else if (c === q) q = null; continue; }
    if (c === '"' || c === "'" || c === '`') q = c;
    else if (c === open) d++;
    else if (c === close && --d === 0) { try { return Function('"use strict";return (' + html.slice(j, k + 1) + ')')(); } catch (e) { return null; } }
  }
  return null;
}
const PAGES = {};
/* Faster (Roger, 7 Nov 2026: "it takes a while to pull all the info here"): the data files used to load one after another as <script>
   tags (they all set window.LP). Now they are all fetched at once and each runs in its own scope with its own `window` (sandbox), so
   none waits for another; a file that cannot run that way falls back to the old one-at-a-time <script> load. */
const runData = txt => { const w = Object.create(window); w.LP = undefined; new Function('window', txt)(w); return w; };
const fetchText = async url => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.text(); };
function loadPage(a) {
  if (PAGES[a.id]) return PAGES[a.id];
  const dir = ROOT + a.path.replace(/[^/]+$/, ''), file = a.path.split('/').pop().replace(/\.html$/, '');
  return PAGES[a.id] = (async () => {
    let txt = null;
    try { txt = await fetchText(dir + 'data/' + file + '.js'); } catch (e) {}
    if (txt != null) {
      let LP = null;
      try { LP = runData(txt).LP; } catch (e) { LP = await serial(async () => { window.LP = undefined; const ok = await loadScript(dir + 'data/' + file + '.js'); const x = window.LP; window.LP = undefined; return ok ? x : null; }); }
      if (LP && Array.isArray(LP.panels)) return { kind: 'engine', a, dir, file, LP };
    }
    try {
      const html = await fetchText(ROOT + a.path);
      if (!/const (vocabMap|levelInfo|listening)\s*=/.test(html)) return null;
      const src = (html.match(/<audio[^>]*>\s*<source src="([^"]+)"/) || [])[1];
      return { kind: 'ls1', a, dir, vocab: grab(html, 'vocabMap'), ca: grab(html, 'ca') || {}, ex: grab(html, 'examples') || {}, info: grab(html, 'levelInfo') || {}, listening: grab(html, 'listening'), audio: src ? new URL(src, new URL(ROOT + a.path, location.href)).href : null };
    } catch (e) { return null; }
  })();
}
// Pro panels (data/native/<page>.js adds LP.native to the page's LP); only for an LS with Pro content (EL_LS pro:true)
function loadNative(pg) {
  if (!pg || pg.kind !== 'engine') return Promise.resolve(pg);
  if (pg.nativeTried) return pg.nativeTried;
  return pg.nativeTried = (async () => {
    try { const txt = await fetchText(pg.dir + 'data/native/' + pg.file + '.js'), w = Object.create(window), LP = Object.assign({}, pg.LP);
      w.LP = LP; new Function('window', txt)(w); pg.native = LP.native || null; } catch (e) {}
    return pg;
  })();
}
function panelsOf(pg, lv) {
  const P = pg.LP.panels || [], N = lv === 'native' && pg.native;
  if (!N) return P;
  const extra = Object.keys(N).filter(k => N[k] && N[k].after && !P.some(p => p.id === k)), as = k => Object.assign({}, N[k], { id: k });
  return P.flatMap(p => [N[p.id] ? as(p.id) : p].concat(extra.filter(k => N[k].after === p.id).map(as)));
}
const plain = h => String(h || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
const MAXW = { beginners: 8, insecure: 10, safe: 14, daring: 18, native: 18 }, MINW = { beginners: 3, insecure: 3, safe: 4, daring: 5, native: 5 };
const sentences = (text, lv) => plain(text).split(/(?<=[.!?])\s+(?=[A-Z“"‘'¿¡])/).map(s => s.trim())
  .filter(s => { const n = s.split(/\s+/).length; return n >= MINW[lv] && n <= MAXW[lv] && /[.!?]$/.test(s) && !/___|…|\[|\]|\s\/\s|\.\.\./.test(s); });

// 🧠 Flashcards: one card per word (English → its Catalan or, on Pro, its meaning, with the example) and one per grammar or 💬 Expressions
// question (the sentence with its gap → the sentence filled in and the rule). The card id comes from the text, so a card keeps its
// progress wherever it is, and a new question is a new card.
const GAP = /_{2,}(?:[\s/]*_{2,})*/g;
// en / ca: the card the other way round, Catalan first (el-flashdeck.js; Roger, 25 Nov 2026); a Pro card's "ca" is an English meaning, so none
const vCard = (en, ca, ex, star, part, pro) => ({ id: 'v:' + norm(en), kind: 'v', part, front: esc(en), say: en, ex: ex || '', star: !!star, en, ca: pro ? '' : (ca || ''),
  back: `<div class="elfd-ans">${esc(ca || '')}</div>${ex ? `<div class="elfd-ex">${esc(ex)}</div>` : ''}` });
// The card shows what is right, all of it (Roger, 25 Nov 2026: "the relative clauses flashcard are missleading"): every right answer
// that only swaps who, which or that (who / that, which / that); a "join" or "fix" question (… → …) turns over to the right sentence
// alone, never the wrong one again, and it can be heard; an answer word keeps its capital from the question (November). The step can
// give the card its own question (fq: the open cloze line with its sentence) or its right sentence (fc: a "fix" with only → ___);

// Students do not see where the practice comes from (Roger, 7 Nov 2026: "I don't want students to see where the info comes from.

const lsTitle = ls => ls === 'all' ? '🔀 ' + t('Totes les meves LS barrejades', 'All my LSs mixed') : lsName(XA.ls.find(l => l.id === ls) || { course: S.course, title: ls });
const chips = n => TABS.filter(([k]) => n[k]).map(([k, i, en, ca]) => `<span title="${esc(t(ca, en))}">${i} ${n[k]}</span>`).join('');
// 1. Choose an LS: one card per LS (newest first) and 🔀 every LS mixed
function chooser() {

}
async function render() {

  if (!S.ls) { const f = lsWithWork()[0]; if (!f) { X = XA; $('#app').innerHTML = header() + none(); return; }
    S.ls = f.id; history.replaceState(null, '', '#' + f.id); }   // the newest LS, chosen on top (lsBar)

// one choice = one step back with the browser's ← (the address keeps the LS and the skill)
function nav(ls, tab) {
  S.ls = ls; S.tab = tab; S.open = null; S.lp = 'all'; MIXQ = null;
  history.pushState(null, '', ls ? '#' + ls + (tab ? '/' + tab : '') : location.pathname + location.search);
  render(); window.scrollTo({ top: 0 });
}
addEventListener('popstate', () => { if ((location.hash === '#deck') !== FC) return; Object.assign(S, fromHash(), { open: (history.state || {}).open || null }); MIXQ = null; render(); });
const none = () => `<div class="empty">${t('Encara no hi ha res per practicar aquí: apareixerà quan el professor obri més Learning Paths.', 'Nothing to practise here yet: it will appear when your teacher opens more Learning Paths.')}</div>`;
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const norm = s => String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[“”"]/g, '').replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim();
// 🔊 Kokoro recordings, voice Heart, American English (shared/js/el-voice.js; Roger, 7 Nov 2026); a text with no recording uses the
// browser's American voice. say([word, example]) plays one after the other.
const say = s => { try { window.ELVoice.say(s, /^(beginners|insecure)$/.test(base(S.level)) ? .85 : 1); } catch (e) {} };

/* 🃏 Word cards: turn the card over, or test yourself (Catalan → English, checked at once). Pro cards from Pro panels carry an
   English meaning instead of the Catalan, so the Test me instruction says "meaning" on that level (fix 2 Nov 2026).
   The cards themselves (look, say it, turn over, ✓ I knew it / ↺ Not yet, ⛶ full screen on the first turn, 🔀 Shuffle, Esc, Space) are
   shared/js/el-wordcards.js since 20 Nov 2026, the same cards as the Vocabulary steps of the Learning Paths (Roger: "like Practise"). */
let test = [], wcList = [], wc = null;
const wcHost = document.createElement('div');
function words() {
  const ws = X.words, hasCore = ws.some(w => w.core);
  if (S.coreOnly == null) S.coreOnly = base(S.level) === 'beginners' && hasCore;
  const list = S.coreOnly && hasCore ? ws.filter(w => w.core) : ws;
  if (!list.length) return $('#body').innerHTML = none();
  const head = `<div class="row"><button class="btn sm" aria-pressed="${S.mode === 'cards'}" data-do="mode" data-v="cards">${t('Targetes', 'Cards')}</button><button class="btn sm" aria-pressed="${S.mode === 'test'}" data-do="mode" data-v="test">${t('Posa’t a prova', 'Test me')}</button>
    ${hasCore ? `<label style="margin-left:6px"><input type="checkbox" data-do="core" ${S.coreOnly ? 'checked' : ''}> ${t('Només les paraules clau', 'Key words only')} <span class="star">⭐</span></label>` : ''}<span class="muted">· ${list.length} ${t('paraules', 'words')}</span>${S.mode === 'cards' ? `<button class="btn g sm" data-do="mix" title="${t('Barreja les targetes que et queden', 'Mix the cards you have left')}">🔀 ${t('Barreja', 'Shuffle')}</button><button class="btn g sm" data-do="focus">⛶ ${t('Pantalla completa', 'Full screen')}</button>` : ''}<a class="btn g sm" style="margin-left:auto;text-decoration:none" href="./">🎲 ${t('Jocs de vocabulari', 'Vocabulary games')}</a></div>`;
  if (S.mode !== 'cards' && wc) wc.gone();
  if (S.mode === 'test') {
    const pool = list.filter(w => w.ca && !/\+|…|___/.test(w.en));
    if (!test.length || test.some(w => !pool.includes(w))) test = shuffle(pool).slice(0, 10);
    $('#body').innerHTML = head + `<div class="card"><div class="how">${S.level === 'native' ? 'Read the meaning and type the English word or expression. Press <b>Check</b>.' : t('Llegeix la paraula en català i escriu-la en anglès. Prem <b>Comprova</b>.', 'Read the word in Catalan and type it in English. Press <b>Check</b>.')}</div>`
      + test.map((w, i) => `<div class="q"><p>${i + 1}. ${esc(w.ca)}${w.core ? ' <span class="star">⭐</span>' : ''}</p><input class="typed" id="tw${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fb" id="tf${i}"></div></div>`).join('')
      + `<div class="row"><button class="btn" data-do="tcheck">${t('Comprova', 'Check')}</button><button class="btn g" data-do="tnew">${t('Unes altres', 'New words')}</button><span class="fb" id="tscore"></span></div></div>`;
    return;
  }
  wcList = list.map(w => ({ front: w.en, back: w.ca, en: w.en, ex: w.ex, star: w.core, src: all() ? w.lp : '' }));
  $('#body').innerHTML = head + '<div id="wcSlot"></div>';
  $('#wcSlot').replaceWith(wcHost);
  if (!wc) wc = ELWordCards.mount(wcHost, { cards: () => wcList, ca: () => !EN, toolbar: false, say,
    onKnow: w => { store.known[w.en] = Date.now(); keep(); } });
  else wc.render();
}
const variants = en => { const v = new Set([en]); en.split(/\s\/\s/).forEach(x => v.add(x)); [...v].forEach(x => v.add(x.replace(/\([^)]*\)/g, ''))); return [...v].map(norm).filter(Boolean); };
function tcheck() {
  let ok = 0;
  test.forEach((w, i) => { const inp = $('#tw' + i), f = $('#tf' + i), right = variants(w.en).includes(norm(inp.value)); if (right) ok++;
    inp.className = 'typed ' + (right ? 'right' : 'wrong'); f.className = 'fb ' + (right ? 'ok' : 'no'); f.innerHTML = right ? '✓' : '✗ ' + t('Resposta', 'Answer') + ': <b>' + esc(w.en) + '</b>'; if (right) store.known[w.en] = Date.now(); });
  keep(); $('#tscore').textContent = ok + ' / ' + test.length + (ok === test.length ? ' 🎉' : '');
}

/* 🧠 Flashcards (Roger, 24 Nov 2026: "a flashcard activity with all the vocabulary and grammar done in each route and by LS… a spaced
   repetition… but for the entire unit… like Anki… all mixed with statistics"; decks hold what the class has done so far): one deck per LS
   with the cards of extract(), studied with shared/js/el-flashdeck.js. Progress is kept in this browser (el_flash_<uid>) and in the student's
   account (students/{uid}/flashcards/all, read once when the decks open, saved a few seconds after studying), so the Chromebook and the
   phone share it. The teacher and testers seeing everything keep it in this browser only. The 👁 student view (the dashboard's 🧠 Flashcards
   place, lab/practice.html?student=…#deck) reads the student's own copy once and shows their decks and statistics; what the teacher studies
   there stays on that page only, never saved (Roger, 24 Nov 2026: "As a teacher I want to be able to see them"). */
const FKEY = () => 'el_flash' + (U ? '_' + U.uid : '');   // per account: two students on one browser never share a deck
let fdView = null;   // 👁 student view: the student's copy, in memory only
const fdAs = () => !DEMO && window.ELCloud && ELCloud.viewing;
const fdLoad = () => { if (fdAs()) return fdView || {}; try { return JSON.parse(localStorage.getItem(FKEY()) || '{}') } catch (e) { return {} } };
// the teacher's own study is saved too (Roger, 25 Nov 2026: "I can even try them and have my own statistics"); never in a 👁 student view
const fdCloudOn = () => !DEMO && U && !ELCloud.viewing && (!all() || ELCloud.isTeacher(U));
const fdRef = () => F.doc(ELCloud.db, 'students', U.uid, 'flashcards', 'all');
// fdSum leaves the counts of today (el_flash_sum_<uid>: reviews due, new cards today, new cards a day) for the board's
// mascot, so the board knows how many cards are waiting without building the decks.
function fdSum(P) {
  if (fdAs() || !XA || all()) return;
  const s = ELFlashDeck.summary(XA.decks, P); let un = 0;
  (XA.decks || []).forEach(d => { const c = ((P.decks || {})[d.id] || {}).c || {}; un += Math.min(15, d.cards.filter(x => !c[x.id]).length); });
  try { localStorage.setItem('el_flash_sum' + (U ? '_' + U.uid : ''), JSON.stringify({ d: ELFlashDeck.dayKey(Date.now()), due: s.due, nw: s.new, un })) } catch (e) {}
}
function fdSave(P) {
  if (fdAs()) { fdView = P; return; }
  try { localStorage.setItem(FKEY(), JSON.stringify(P)) } catch (e) {}
  fdSum(P);
  if (window.elMascotRefresh) elMascotRefresh();   // the ⚡ streak in the bottom-right bar follows at once
  if (!fdCloudOn()) return;
  // the account's copy may have cards studied on another device since it was read (a phone, a tab left open): read it again first when the
  // last read is over 5 minutes old, merge, then write, so a save never wipes them (25 Nov 2026: students studied and their ⚡ stayed at 0)
  const put = Q => F.setDoc(fdRef(), { p: JSON.stringify(Q), at: F.serverTimestamp() }).catch(e => console.warn('flashcards save', e));
  if (Date.now() - fdReadAt < 5 * 60e3 || document.visibilityState === 'hidden') { put(P); return; }   // leaving the page: no time to read
  fdReadAt = Date.now();
  F.getDoc(fdRef()).then(snap => { const cloud = snap.exists() ? JSON.parse(snap.data().p || '{}') : null;
    const m = cloud ? ELFlashDeck.merge(fdLoad(), cloud) : fdLoad(); try { localStorage.setItem(FKEY(), JSON.stringify(m)) } catch (e) {} put(m); if (cloud && fd) fd.reload(); })
    .catch(e => { console.warn('flashcards read', e); put(P); });
}
let fd = null, fdRead = null, fdReadAt = 0;
const fdHost = document.createElement('div');
function fdCloud() {   // once per visit: the account's copy, merged with this browser's (the latest review of each card wins)
  if (fdAs() && !fdRead) {   // 👁 the student's own copy, read only
    fdRead = F.getDoc(F.doc(ELCloud.db, 'students', ELCloud.viewing.uid, 'flashcards', 'all')).then(snap => { fdView = snap.exists() ? JSON.parse(snap.data().p || '{}') : {}; if (fd) fd.reload(); })
      .catch(e => console.warn('flashcards read', e));
    return;
  }
  if (!fdCloudOn() || fdRead) return;
  fdReadAt = Date.now();
  fdRead = F.getDoc(fdRef()).then(snap => { const cloud = snap.exists() ? JSON.parse(snap.data().p || '{}') : null; if (!cloud) return;
    const m = ELFlashDeck.merge(fdLoad(), cloud); try { localStorage.setItem(FKEY(), JSON.stringify(m)) } catch (e) {} if (fd) fd.reload(); }).catch(e => console.warn('flashcards read', e));
}
function deck() {
  $('#body').innerHTML = '<div id="fdSlot"></div>'; $('#fdSlot').replaceWith(fdHost);
  if (!fd) fd = ELFlashDeck.mount(fdHost, { decks: () => X.decks, ca: () => !EN, load: fdLoad, save: fdSave, say, me: () => fdAs() || all() ? null : (U ? U.uid : '') });
  else fd.render();

}

/* 🧩 Sentence builder: sentences of the route's models and examples, words shuffled */
let set = [], built = [];
function build() {
  if (!X.build.length) return $('#body').innerHTML = none();
  const ids = X.build.map(b => b.s).join('|');
  if (set.ids !== ids) { set = shuffle(X.build).slice(0, 6); set.ids = ids; set.words = set.map(b => shuffle(b.s.split(/\s+/).map((w, i) => ({ w, i })))); built = set.map(() => []); }
  $('#body').innerHTML = backRow(t('Tot el Writing', 'All writing')) + `<div class="card"><h3>🧩 Sentence builder</h3><div class="how">${t('Toca les paraules en ordre per fer la frase. Toca una paraula de la frase per treure-la. Després prem <b>Comprova</b>.', 'Tap the words in order to build the sentence. Tap a word in your sentence to take it out. Then press <b>Check</b>.')}</div>`
    + set.map((b, i) => `<div class="q"><p>${i + 1}. ${srcLine(`<small class="muted">${esc(b.lp)}</small>`)}</p><div class="line" id="bl${i}">${built[i].map(j => `<button class="w" data-do="unpick" data-i="${i}" data-j="${j}">${esc(set.words[i][j].w)}</button>`).join('')}</div>
      <div class="bank">${set.words[i].map((x, j) => `<button class="w ${built[i].includes(j) ? 'used' : ''}" data-do="pick" data-i="${i}" data-j="${j}">${esc(x.w)}</button>`).join('')}</div><div class="fb" id="bf${i}"></div></div>`).join('')
    + `<div class="row"><button class="btn" data-do="bcheck">${t('Comprova', 'Check')}</button><button class="btn g" data-do="bnew">${t('Unes altres frases', 'New sentences')}</button><span class="fb" id="bscore"></span></div></div>`;
}
function bcheck() {

    f.innerHTML = right ? '✓ <button class="btn g sm" data-do="say" data-v="' + esc(b.s) + '">🔊</button>' : '✗ ' + t('Frase correcta', 'Correct sentence') + ': <b>' + esc(b.s) + '</b>'; });
  $('#bscore').textContent = ok + ' / ' + set.length + (ok === set.length ? ' 🎉' : '');
}

/* 🎧 Listening: the LS listenings and videos with the route's questions; Starter starts on the slow copy.
   📖 Reading (25 Nov 2026) works the same way, with the route's text instead of the recording. */
let ans = {};
const QL = () => S.tab === 'read' ? X.read : X.listen;
const qHint = q => elCa(base(S.level)) ? q.h : (q.he || '');   // Starter's hint in Catalan, the others' in English
const itemTitle = x => all() ? x.title : x.title.replace(/\s*\((warm-up|escalfament)\)\s*$/i, '');   // LS1 listenings are named after their path
function listen() {
  const RD = S.tab === 'read', LS = QL();
  if (!LS.length) return $('#body').innerHTML = none();
  const e = LS.find(x => x.key === S.open);
  if (!e) {
    $('#body').innerHTML = `<div class="how">${RD ? t('Tria un text. Llegeix-lo, respon les preguntes i comprova. Pots repetir-lo tantes vegades com vulguis.', 'Choose a text. Read it, answer the questions and check. You can do it again as many times as you like.') : t('Tria una escolta. Escolta-la, respon les preguntes i comprova. Pots repetir-la tantes vegades com vulguis.', 'Choose a listening. Listen, answer the questions and check. You can do it again as many times as you like.')}</div><div class="list">`
      + LS.map(x => { const b = store.listen[x.key + '@' + S.level]; return `<button class="item" data-do="open" data-v="${esc(x.key)}"><b>${{ audio: '🎧', text: '📖' }[x.media.kind] || '🎬'} ${esc(itemTitle(x))}</b><small>${srcLine(esc(x.lp) + ' · ')}${x.items.length} ${t('preguntes', 'questions')}</small>${b ? `<small class="done">✓ ${t('Millor', 'Best')}: ${b}</small>` : ''}</button>`; }).join('') + `</div>`;
    return;
  }
  const slow = elCa(base(S.level)) && base(S.level) === 'beginners', m = e.media;
  if (!e.order) e.order = e.items.map(q => shuffle(q.o));
  ans = {};
  let media = '';
  if (m.kind === 'audio') media = `<audio id="aud" controls preload="metadata" src="${esc(slow && m.slow ? m.slow : m.src)}"></audio>${m.slow ? `<div class="row"><button class="btn sm" data-do="speed" data-v="0" aria-pressed="${!slow}">${t('Velocitat normal', 'Normal speed')}</button><button class="btn sm" data-do="speed" data-v="1" aria-pressed="${slow}">${t('Més lent', 'Slower')}</button></div>` : ''}`;

    rec: () => trecStart(), recstop: () => { if (trc && trc.state === 'recording') trc.stop(); },
    model: () => { const m = $('#tmodel'); if (m) { m.hidden = !m.hidden; el.textContent = m.hidden ? '👀 ' + t('Mostra el model', 'Show the model') : t('Amaga el model', 'Hide the model'); } },
    saymodel: () => { const x = X.speak.find(y => y.key === S.open); if (x && x.model) say(plain(x.model)); },
    gcheck: () => gcheck(true), gagain: () => go(() => { if (S.open === 'mixq') { MIXQ = null; Object.keys(gtries).forEach(x => { if (x.startsWith('mixq')) delete gtries[x]; }); return; } const b = (store.gram[gKey()] || {}).best; if (b) store.gram[gKey()] = { best: b }; else delete store.gram[gKey()]; keep(); Object.keys(gtries).forEach(x => { if (x.startsWith(S.open)) delete gtries[x]; }); }),
    gpick: () => { const b = $('#gq' + k.i); if (b) { b.value = k.v; $$(`[data-do="gpick"][data-i="${k.i}"]`).forEach(x => x.classList.toggle('on', x === el)); } }
  })[k.do]?.();
});
document.addEventListener('change', e => { const el = e.target.closest('select[data-do="lp"]'); if (el) { S.lp = el.value; S.open = null; render(); } });

function start() {
  const c = myCourse();
  S.course = S.course || (all() ? (c || '2eso') : c);
  EN = all() || (myLevel() ? !elCa(base(myLevel())) : false);
  document.documentElement.lang = EN ? 'en' : 'ca';
  $('#title').textContent = FC ? '🧠 ' + t('Targetes', 'Flashcards') : t('Practica', 'Practise');
  document.title = (FC ? t('Targetes', 'Flashcards') : t('Practica', 'Practise')) + ' · English with Roger';
  $$('[data-pr]').forEach(a => a.textContent = t('Practica', 'Practise'));
  if (!S.course) { $('#lead').textContent = t('Encara no tens cap grup: parla amb el professor.', 'You are not in a group yet: talk to your teacher.'); return; }
  $('#lead').innerHTML = FC ? t('Tot el vocabulari i la gramàtica de cada LS, al teu nivell. Estudia una mica cada dia: cada targeta torna quan la necessites.', 'All the vocabulary and grammar of each LS, at your level. Study a little every day: each card comes back when you need it.')
    : t('A dalt tria una LS, o totes barrejades, i després què vols practicar: vocabulari, gramàtica, listening, reading, writing o speaking. Tot és del teu nivell i no s’entrega res: practica tant com vulguis.', 'Choose an LS at the top, or all of them mixed, and then what you want to practise: vocabulary, grammar, listening, reading, writing or speaking. It is all at your level and nothing is handed in: practise as much as you like.');
  S.level = all() ? (S.level || 'insecure') : (myLevel() || 'insecure');   // a student always works at their own level
  // students get everything at their level in one place (no LS filter, newest LS first: content())
  if (!levelsOf(S.course).includes(S.level)) S.level = 'insecure';
  const want = all() && new URLSearchParams(location.search).get('level'), st = want && LADDER.find(x => x.k === want);
  if (st && !S.step) [S.course, S.level] = st.pairs[0];
  S.step = S.step || stepOf(S.course, S.level);
  render();
}
if (DEMO) { D = await load(); start(); }
else {
  ELCloud.onUser(async u => {
    U = u;
    if (!u) { $('#lead').textContent = ''; $('#app').innerHTML = `<div class="signin"><p>Entra amb el teu correu de l’institut i la contrasenya per practicar. · Sign in with your school email and password to practise.</p><button class="btn" id="si">Sign in</button></div>`; $('#si').onclick = () => ELCloud.login(); return; }
    D = await load(u); start();
  });
  ELCloud.auth.authStateReady().then(() => { if (!ELCloud.auth.currentUser) { $('#lead').textContent = ''; $('#app').innerHTML = `<div class="signin"><p>Entra amb el teu correu de l’institut i la contrasenya per practicar. · Sign in with your school email and password to practise.</p><button class="btn" id="si">Sign in</button></div>`; $('#si').onclick = () => ELCloud.login(); } });
}
</script>
