<script type="module">
/* Self-practice by level (Roger, 31 Oct 2026, thread "Build a self-practice area by level"): the word cards, sentence builder,
   listenings and shadowing of the student's LSs, organised by level (the route with its CEFR label, EL_CEFR in el-catalog.js) and
   with the student's own level recommended. Nothing new: the page reads the LS content itself (LS2-style pages: <ls>/data/<page>.js,
   Pro panels from data/native/; LS1 pages: the vocabMap / ca / examples / levelInfo / listening objects in the page), so a new LS
   appears here on its own. Only the LSs and Learning Paths the student can open (status, group, paths opened by the teacher).
   Everything corrects itself and nothing is handed in: progress stays in this browser (el_ key, never synced). */
const DEMO = window.EL_DEMO_STUDENT;   // preview: {group, levels:{ls:{level}}, ls:{id:info}, teacher}
let F = null;
if (!DEMO) { await import('../shared/js/el-cloud.js'); F = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js'); }
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ROOT = '../';
const ROUTES = ['beginners', 'insecure', 'safe', 'daring'];
const KEY = 'el_practice';   // el_ keys stay in this browser
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) { return {} } })();
const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(store)) } catch (e) {} };
store.known = store.known || {}; store.listen = store.listen || {}; store.shadow = store.shadow || {};

/* ---------- routes, as in the LS2 engine: cumulative r: tags, Starter falls back to Base, Pro to Plus ---------- */
const base = lv => lv === 'native' ? 'daring' : lv;
const inR = (x, lv) => ROUTES.indexOf(x.r || 'beginners') <= ROUTES.indexOf(base(lv)) && (!x.only || x.only.includes(base(lv)));
const forLevel = (items, lv) => !items ? [] : Array.isArray(items) ? items.filter(x => inR(x, lv))
  : (items[lv] || items[base(lv)] || (base(lv) === 'beginners' ? items.insecure : null) || []);
const byLevel = (o, lv) => o == null ? '' : typeof o === 'string' ? o
  : o.ca != null || o.en != null ? (elCa(base(lv)) ? (o.ca || o.en) : (o.en || o.ca))
  : (o[lv] ?? o[base(lv)] ?? (base(lv) === 'daring' ? o.safe : null) ?? o.insecure ?? '');
const tx = o => o == null ? '' : typeof o === 'string' ? o : (o.en || o.ca || '');
const ls1Level = lv => lv === 'beginners' ? 'insecure' : base(lv);

/* ---------- reading the LS content ---------- */
const loadScript = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = () => { s.remove(); res(true) }; s.onerror = () => { s.remove(); res(false) }; document.head.append(s) });
let queue = Promise.resolve();   // the data files all set window.LP: one at a time
const serial = f => (queue = queue.then(f, f));
// one object literal from a page's script: const name={…} / [...] (quote-aware bracket matching)
function grab(html, name) {
  const i = html.search(new RegExp('\\bconst ' + name + '\\s*=\\s*[\\[{]')); if (i < 0) return null;
  const j = html.indexOf(html.slice(i).match(/[\[{]/)[0], i), open = html[j], close = open === '{' ? '}' : ']';
  let d = 0, q = null;
  for (let k = j; k < html.length; k++) {
    const c = html[k];
    if (q) { if (c === '\\') k++; else if (c === q) q = null; continue; }
    if (c === '"' || c === "'" || c === '`') q = c;
    else if (c === open) d++;
    else if (c === close && --d === 0) { try { return Function('"use strict";return (' + html.slice(j, k + 1) + ')')(); } catch (e) { return null; } }
  }
  return null;
}
const PAGES = {};
function loadPage(a) {
  if (PAGES[a.id]) return PAGES[a.id];
  const dir = ROOT + a.path.replace(/[^/]+$/, ''), file = a.path.split('/').pop().replace(/\.html$/, '');
  return PAGES[a.id] = serial(async () => {
    window.LP = undefined;
    if (await loadScript(dir + 'data/' + file + '.js') && window.LP && Array.isArray(window.LP.panels)) {
      const LP = window.LP; window.LP = undefined;
      return { kind: 'engine', a, dir, file, LP };
    }
    window.LP = undefined;
    try {
      const html = await (await fetch(ROOT + a.path)).text();
      if (!/const (vocabMap|levelInfo|listening)\s*=/.test(html)) return null;
      const src = (html.match(/<audio[^>]*>\s*<source src="([^"]+)"/) || [])[1];
      return { kind: 'ls1', a, dir, vocab: grab(html, 'vocabMap'), ca: grab(html, 'ca') || {}, ex: grab(html, 'examples') || {}, info: grab(html, 'levelInfo') || {}, listening: grab(html, 'listening'), audio: src ? new URL(src, new URL(ROOT + a.path, location.href)).href : null };
    } catch (e) { return null; }
  });
}
// Pro panels (data/native/<page>.js adds LP.native to the page's LP); only for an LS with Pro content (EL_LS pro:true)
function loadNative(pg) {
  if (!pg || pg.kind !== 'engine') return Promise.resolve(pg);
  if (pg.nativeTried) return pg.nativeTried;
  return pg.nativeTried = serial(async () => {
    window.LP = pg.LP;
    try { if (await loadScript(pg.dir + 'data/native/' + pg.file + '.js')) pg.native = pg.LP.native || null; } catch (e) {}
    window.LP = undefined; return pg;
  });
}
function panelsOf(pg, lv) {
  const P = pg.LP.panels || [], N = lv === 'native' && pg.native;
  if (!N) return P;
  const extra = Object.keys(N).filter(k => N[k] && N[k].after && !P.some(p => p.id === k)), as = k => Object.assign({}, N[k], { id: k });
  return P.flatMap(p => [N[p.id] ? as(p.id) : p].concat(extra.filter(k => N[k].after === p.id).map(as)));
}
const plain = h => String(h || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
const MAXW = { beginners: 8, insecure: 10, safe: 14, daring: 18, native: 18 }, MINW = { beginners: 3, insecure: 3, safe: 4, daring: 5, native: 5 };
const sentences = (text, lv) => plain(text).split(/(?<=[.!?])\s+(?=[A-Z“"‘'¿¡])/).map(s => s.trim())
  .filter(s => { const n = s.split(/\s+/).length; return n >= MINW[lv] && n <= MAXW[lv] && /[.!?]$/.test(s) && !/___|…|\[|\]|\s\/\s|\.\.\./.test(s); });

// What a page gives one level: words, sentences to build, listenings (with their questions) and shadowing clips.
function extract(pg, lv) {
  const out = { words: [], build: [], listen: [], shadow: [] }, lp = pg.a.title, at = pg.a.id;
  if (pg.kind === 'ls1') {
    const L = ls1Level(lv);
    (pg.vocab && pg.vocab[L] || []).forEach(([g, list]) => (list || []).forEach(en => out.words.push({ en, ca: pg.ca[en] || '', ex: pg.ex[en] || '', g, lp, at })));
    ((pg.info[L] || {}).builders || []).forEach(b => out.build.push({ s: b.join(' '), lp, at }));
    const qs = pg.listening && pg.listening[L];
    if (pg.audio && Array.isArray(qs) && qs.length)
      out.listen.push({ key: at + '#listen', title: lp, lp, media: { kind: 'audio', src: pg.audio }, items: qs.map(q => ({ q: q.q, o: [q.o[q.a]].concat(q.o.filter((x, i) => i !== q.a)) })) });
    return out;
  }
  const texts = [];
  panelsOf(pg, lv).forEach(p => {
    if (p.type === 'vocab') {
      const core = new Set(forLevel(p.core, lv));
      (p.groups || []).filter(g => inR(g, lv)).forEach(g => (g.items || []).forEach(it => {
        const [en, ca, ex] = Array.isArray(it) ? it : [it.en, it.ca, it.ex];
        if (en) out.words.push({ en, ca: ca || '', ex: ex || '', g: g.g, core: core.has(en), lp, at });
      }));
    }
    const m = p.media;
    if (m && p.items && /^(mc|quiz)$/.test(p.type)) {
      let media = null;
      if (m.audio) media = { kind: 'audio', src: pg.dir + m.audio, slow: pg.dir + m.audio.replace(/\.mp3$/, '-slow.mp3'), script: m.script };
      else if (Array.isArray(m.videos) && m.videos.length) media = { kind: 'video', list: m.videos.map(v => ({ title: v.title, src: pg.dir + v.base + '.mp4', slow: pg.dir + v.base + '-slow.mp4', vtt: pg.dir + v.base + '.vtt', vttSlow: pg.dir + v.base + '-slow.vtt', poster: pg.dir + v.base + '-poster.jpg' })), credit: m.videoCredit };
      else if (m.youtube) media = { kind: 'yt', id: m.youtube, credit: m.credit };
      const items = forLevel(p.items, lv).filter(q => Array.isArray(q.o) && q.o.length > 1);
      if (media && items.length) {
        let title = m.title || (media.list && media.list.map(v => v.title).join(' · ')) || tx(p.title);
        if (out.listen.some(x => x.title === title)) title += ' · ' + tx(p.tab);   // the same recording twice in a page (e.g. the sample exam)
        out.listen.push({ key: at + '#' + p.id, title, lp, media, items });
      }
    }
    if (p.type === 'shadow' && p.clip) { const c = p.clip; out.shadow.push({ key: at + '#' + p.id, title: c.title || tx(p.title), lp, src: pg.dir + c.src, slow: c.slow ? pg.dir + c.slow : null, t: c.t, ts: c.ts, lines: c.lines || [], video: !!c.video || /\.mp4$/.test(c.src), poster: c.poster ? pg.dir + c.poster : null }); }
    if ((p.type === 'speaking' || p.type === 'talk' || p.type === 'writing') && p.model) texts.push(byLevel(p.model, lv));
  });
  const seen = new Set();
  texts.concat(out.words.map(w => w.ex)).forEach(t => sentences(t, lv).forEach(s => { if (!seen.has(s)) { seen.add(s); out.build.push({ s, lp, at }); } }));
  return out;
}

/* ---------- who is here ---------- */
const COURSES = { '2eso': '2 ESO', '4eso': '4 ESO' };
const S = { tab: (location.hash.slice(1) || 'words'), course: null, level: null, ls: 'all', lp: 'all', mode: 'cards', coreOnly: null, open: null };
if (!['words', 'build', 'listen', 'shadow'].includes(S.tab)) S.tab = 'words';
let U = null, D = null, EN = true;
const t = (ca, en) => EN ? en : ca;
const all = () => DEMO ? !!DEMO.teacher : !!U && (ELCloud.isTeacher(U) || (ELCloud.isTester(U) && !ELCloud.viewGroup()));
async function load(u) {
  if (DEMO) return { group: DEMO.group, lv: DEMO.levels || {}, ls: DEMO.ls || {} };
  const db = ELCloud.db, D = { group: ELCloud.viewGroup() || ELCloud.group(), lv: {}, ls: {} };
  try { (await F.getDocs(F.collection(db, 'students', u.uid, 'levels'))).forEach(l => D.lv[l.id] = l.data()); } catch (e) {}
  for (const l of EL_LS) D.ls[l.id] = await ELCloud.lsInfo(l.id);
  return D;
}
const myCourse = () => (EL_GROUPS.find(g => g.id === D.group) || {}).course || null;
const visibleLS = c => EL_LS.filter(l => l.course === c && (all() || ((D.ls[l.id] || {}).status || 'hidden') !== 'hidden' && elLsForGroup(l, D.ls[l.id], D.group)));
const canDo = a => { const i = D.ls[a.ls] || {}; return all() || i.status === 'closed' || elLpOpen(a, i, D.group); };
// the student's level now: the route of the latest LS they can see (elRouteOf carries it over from earlier LSs)
const myLevel = () => { if (all()) return null; const L = visibleLS(myCourse()); return L.length ? elRouteOf(D.lv, L[L.length - 1].id).level : null; };
const levelsOf = c => ROUTES.concat(c === '4eso' && (all() || myLevel() === 'native') ? ['native'] : []);
const name = lv => (EL_LEVELS.find(l => l.id === lv) || {}).name || lv;

/* ---------- content for the level on screen ---------- */
async function content() {
  const L = visibleLS(S.course).filter(l => S.ls === 'all' || l.id === S.ls), acts = [];
  L.forEach(l => EL_CATALOG.filter(a => a.ls === l.id && !a.manual && !a.inClass && !a.checkpoint && !/reflect$/.test(a.id) && canDo(a)).forEach(a => acts.push({ a, l })));
  const out = { words: [], build: [], listen: [], shadow: [], lps: acts, ls: L };
  const pages = await Promise.all(acts.map(({ a, l }) => loadPage(a).then(pg => S.level === 'native' && l.pro ? loadNative(pg) : pg)));
  pages.forEach((pg, i) => { if (!pg || (S.lp !== 'all' && acts[i].a.id !== S.lp)) return; const x = extract(pg, S.level); Object.keys(x).forEach(k => out[k].push(...x[k].map(y => Object.assign(y, { ls: acts[i].l })))); });
  const seen = new Set(); out.words = out.words.filter(w => { const k = w.en.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  return out;
}

/* ---------- page ---------- */
function header() {
  const mine = myLevel(), c = S.course, rec = mine || 'insecure', L = levelsOf(c);
  const label = lv => esc(elLevelLabel(c, lv));

    speed: () => { const e = X.listen.find(x => x.key === S.open), a = $('#aud'); a.src = k.v === '1' ? e.media.slow : e.media.src; a.currentTime = 0; $$('[data-do="speed"]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
    splay: () => splay(+k.i), sstop: () => { const m = $('#sm' + k.i); m.pause(); m.ontimeupdate = null; if (rec && rec.state === 'recording') rec.stop(); },
    shide: () => { const s = $('#st' + k.i); s.hidden = !s.hidden; el.textContent = s.hidden ? t('Mostra el text', 'Show the script') : t('Amaga el text', 'Hide the script'); },
    srec: () => srec(+k.i)
  })[k.do]?.();
});
document.addEventListener('change', e => { const el = e.target.closest('select[data-do="lp"]'); if (el) { S.lp = el.value; S.open = null; render(); } });

function start() {
  const c = myCourse();
  S.course = S.course || (all() ? (c || '2eso') : c);
  EN = all() || (myLevel() ? !elCa(base(myLevel())) : false);
  document.documentElement.lang = EN ? 'en' : 'ca';
  $('#title').textContent = t('Practica pel teu compte', 'Practise on your own');
  document.title = t('Practica pel teu compte', 'Practise on your own') + ' · English Lab';
  $$('[data-me]').forEach(a => { a.hidden = false; a.textContent = t('Les meves activitats', 'My activities'); });
  $$('[data-pr]').forEach(a => a.textContent = t('Practica', 'Practise'));
  if (!S.course) { $('#lead').textContent = t('Encara no tens cap grup: parla amb el professor.', 'You are not in a group yet: talk to your teacher.'); return; }
  $('#lead').innerHTML = t('Les targetes de paraules, el sentence builder, les escoltes i el shadowing de les teves LS, per nivells. Tot es corregeix sol i no s’entrega res: practica tant com vulguis.', 'The word cards, sentence builder, listenings and shadowing of your LSs, by level. Everything corrects itself and nothing is handed in: practise as much as you like.');
  S.level = S.level || myLevel() || 'insecure';
  // start on the LS the group is working on now (the last open one), not on everything
  const open = visibleLS(S.course).filter(l => (D.ls[l.id] || {}).status === 'open');
  if (S.ls === 'all' && open.length && !all()) S.ls = open[open.length - 1].id;
  if (!levelsOf(S.course).includes(S.level)) S.level = 'insecure';
  render();
}
if (DEMO) { D = await load(); start(); }
else {
  ELCloud.onUser(async u => {
    U = u;
    if (!u) { $('#lead').textContent = ''; $('#app').innerHTML = `<div class="signin"><p>Entra amb el teu correu de l’institut i la contrasenya per practicar. · Sign in with your school email and password to practise.</p><button class="btn" id="si">Sign in</button></div>`; $('#si').onclick = () => ELCloud.login(); return; }
    D = await load(u); start();
  });
  ELCloud.auth.authStateReady().then(() => { if (!ELCloud.auth.currentUser) { $('#lead').textContent = ''; $('#app').innerHTML = `<div class="signin"><p>Entra amb el teu correu de l’institut i la contrasenya per practicar. · Sign in with your school email and password to practise.</p><button class="btn" id="si">Sign in</button></div>`; $('#si').onclick = () => ELCloud.login(); } });
}
</script>
