# 🤖 Real-use tests (Roger, 25 Nov 2026). On every pull request that changes the site, tools/real-use/check.mjs has a robot use the site
# the way a student and Roger do (hand in a step, ↺ Redo, flashcards, a problem report, Easy reading, the notebook, the exam, 📣 Publish)
# in a real browser, with the real Firebase code and firestore.rules, against a FREE TEST COPY of the database that lives only on this
# runner (the Firebase emulator, project demo-english-lab). Invented students only; no secrets; a try to reach the real database fails.
name: Real-use tests
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4   # the database emulator runs on Java
        with: { distribution: temurin, java-version: 21 }
      - run: npm i --no-save playwright@1.48.2 firebase-tools@13.35.1 firebase@10.14.1 firebase-admin@12.7.0
      - run: npx playwright install chromium || (sleep 20 && npx playwright install chromium)
      # as in smoke.yml: Ubuntu's font servers are sometimes unreachable; the runner's own libraries are enough
      - run: timeout 180 npx playwright install-deps chromium || echo "::warning::Ubuntu's servers could not be reached; using the runner's own libraries"
      - run: node tools/real-use/check.mjs
        env: { SHOTS: real-use-shots }   # a picture of the end of each test, to see what the robot saw when one fails
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: real-use-shots, path: real-use-shots, if-no-files-found: ignore }
