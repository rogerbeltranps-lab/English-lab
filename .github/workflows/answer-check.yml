# When a typed answer counts (Roger, 22 Nov 2026: "do students have the same problem?"). tools/answer-check/check.mjs checks that the
# ANSWER CHECK block is the same in both LS2 engines and 4 ESO Getting started, and runs its cases. Free, read-only, no secrets, no browser.
name: Answer check
on:
  pull_request:
    paths: ['2eso/**', '4eso/**', 'tools/answer-check/**', '.github/workflows/answer-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/answer-check/check.mjs
