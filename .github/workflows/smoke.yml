# 🧪 Does it still open? (Roger, 24 Nov 2026). On every pull request that changes the site, tools/smoke/check.mjs opens the teacher's
# dashboard (every item of its menu), the student board and its places, every LS2 page, Practise and Games with invented students only,
# on the two Chromebook screens (normal mode 1366 × 640, full screen 1366 × 768) and a phone, and fails when a page throws an error, shows nothing, is wider than a phone, misses a file,
# or tries to reach the real database. Free, read-only, no secrets: every request outside the repo is blocked.
name: Does it still open
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install chromium || (sleep 20 && npx playwright install chromium)
      # as in answers-stay.yml: Ubuntu's font servers are sometimes unreachable; the runner's own libraries are enough
      - run: timeout 180 npx playwright install-deps chromium || echo "::warning::Ubuntu's servers could not be reached; using the runner's own libraries"
      - run: node tools/smoke/check.mjs
      # 🔔 the students' notifications and the mascot in the bar, with a fake in-memory database (Roger, 25 Nov 2026): nothing held shows early
      - run: node tools/notify/check.mjs
      - run: node tools/hand-tick/check.mjs
