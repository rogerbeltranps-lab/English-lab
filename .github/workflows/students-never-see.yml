name: Students never see Towards Nativeness
# Roger's own course is hidden from students, also in the teacher's student view (Roger, 20 Nov 2026). tools/students-never-see/check.mjs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/students-never-see/check.mjs
